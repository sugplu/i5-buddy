<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- I-5 Buddy logo, "Sunset Stripes" (original art, 2026-11-14): a 5 drawn in 70s California sunset stripes.
       Android maskable copy (logo at 80%, inside the safe circle) of the master: a full-bleed square (iOS and Android cut the corners). tools/icons.py makes every icon from
       it; the iPhone app's App Store icon is the same file (i5-buddy-ios/assets/app-icon.svg). -->
  <defs>
    <linearGradient id="i5-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A1F2B"/>
      <stop offset="1" stop-color="#36101A"/>
    </linearGradient>
    <filter id="i5-lift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#050A1C" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#i5-sky)"/>
  <g transform="translate(512 512) scale(0.8) skewX(-9) scale(0.94) translate(-512 -512)">
    <g filter="url(#i5-lift)">
    <path d="M772 217L322 217L322 387A80 80 0 0 0 402 467L512 467A170 170 0 0 1 512 807L322 807" fill="none" stroke="#FFE7B0" stroke-width="160" stroke-linecap="butt" stroke-linejoin="miter"/>
    <path d="M772 197L302 197L302 387A100 100 0 0 0 402 487L512 487A150 150 0 0 1 512 787L322 787" fill="none" stroke="#FFC23D" stroke-width="120" stroke-linecap="butt" stroke-linejoin="miter"/>
    <path d="M772 177L282 177L282 387A120 120 0 0 0 402 507L512 507A130 130 0 0 1 512 767L322 767" fill="none" stroke="#FF8A2B" stroke-width="80" stroke-linecap="butt" stroke-linejoin="miter"/>
    <path d="M772 157L262 157L262 387A140 140 0 0 0 402 527L512 527A110 110 0 0 1 512 747L322 747" fill="none" stroke="#F0532E" stroke-width="40" stroke-linecap="butt" stroke-linejoin="miter"/>
    </g>
  </g>
</svg>
