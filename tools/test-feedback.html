<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I-5 Buddy feedback module test</title>
<!--
  Drives js/feedback.js inside the real app. Results: bottom bar + console "[test-feedback] ...".
  ?s=      all (default) | view (leaves the sheet open for a screenshot; ?view=form|filled|error|done|offline)
  ?theme=  dark | light       ?w= ?h=  iframe size (default 390 x 844)
  Checks: the Settings row, the form (labels, email type, counter, honeypot), validation, the request (URL, method, exact
  payload, version from sw.js), sending / thanks / server error / rate limit / network error / timeout states, remembered
  name and email, the unsent draft, offline, and that nothing is sent until Send (fetch is mocked).
  The app loads as srcdoc with service-worker registration stubbed (see test-live.html).
-->
<style>
  html,body{margin:0;background:#2b2f2d;color:#e8ece9;font:12px/1.35 ui-monospace,Menlo,monospace}
  #f{display:block;width:390px;height:844px;border:0;background:#000}
  #bar{position:fixed;left:0;right:0;bottom:0;height:26px;padding:6px 8px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#111}
  #bar.pass{background:#0b6e3f}
  #bar.fail{background:#9b1d16}
</style>
</head>
<body>
<iframe id="f" title="I-5 Buddy under test"></iframe>
<div id="bar">starting…</div>
<script type="module">
const Q = new URLSearchParams(location.search), SCEN = Q.get("s") || "all", THEME = Q.get("theme") || "dark";
const f = document.getElementById("f");
f.style.width = (+(Q.get("w") || 390)) + "px";
f.style.height = (+(Q.get("h") || 844)) + "px";
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 6000, step = 40) {
  const t0 = performance.now();
  for (;;) { let v; try { v = fn(); } catch {} if (v) return v; if (performance.now() - t0 > ms) throw new Error("timed out waiting"); await wait(step); }
}
const checks = [];
function log(...a) { console.log("[test-feedback] " + a.map(x => (typeof x === "string" ? x : JSON.stringify(x))).join(" ")); }
function check(name, ok, extra = "") { checks.push([name, !!ok]); log(`${ok ? "PASS" : "FAIL"} ${name}${extra ? " · " + extra : ""}`); }
function finish() {
  const bad = checks.filter(c => !c[1]).length, bar = document.getElementById("bar");
  bar.className = bad ? "fail" : "pass";
  bar.textContent = `${SCEN} · ${THEME} · ${checks.length - bad}/${checks.length} pass${bad ? " · FAIL: " + checks.filter(c => !c[1]).map(c => c[0]).join(", ") : ""}`;
  log(bad ? `RESULT FAILED ${bad}` : `RESULT ALL PASS (${checks.length})`);
}
const txt = n => (n ? n.textContent.replace(/\s+/g, " ").trim() : "");
const $ = (doc, sel) => doc.querySelector(sel);

async function boot() {
  localStorage.clear();
  localStorage.setItem("i5b:settings", JSON.stringify({ live: false, theme: THEME, narr: false }));
  const html = await (await fetch("../index.html", { cache: "no-store" })).text();
  const stub = `<base href="${new URL("../", location.href).href}"><script>try{Object.defineProperty(navigator.serviceWorker,"register",{configurable:true,value:function(){return new Promise(function(){})}})}catch(e){}<\/script>`;
  f.srcdoc = html.replace(/<head>/i, "<head>" + stub);
  await until(() => f.contentDocument && f.contentDocument.readyState === "complete" && f.contentWindow.I5BUDDY && f.contentWindow.I5BUDDY.api.feedback, 20000);
  await wait(200);
  const win = f.contentWindow, doc = f.contentDocument, api = win.I5BUDDY.api;
  api.settings.theme = THEME; doc.documentElement.dataset.theme = THEME;
  return { win, doc, api };
}
const NAV = (win, name, value) => Object.defineProperty(win.navigator, name, { configurable: true, value, writable: true });

/** Mock /api/feedback in the app; everything else (sw.js) goes through. mode: ok | 400 | 429 | 500 | down | hang */
function mockNet(win) {
  const net = { calls: [], mode: "ok", delay: 250 };
  const real = win.fetch.bind(win);
  win.fetch = async (url, opts = {}) => {
    url = String(url && url.url || url);
    if (!/\/api\/feedback$/.test(url)) return real(url, opts);
    net.calls.push({ url, method: opts.method, headers: opts.headers, body: opts.body, t: Date.now() });
    await new Promise((res, rej) => { const t = setTimeout(res, net.mode === "hang" ? 120e3 : net.delay); opts.signal && opts.signal.addEventListener("abort", () => { clearTimeout(t); rej(new win.DOMException("aborted", "AbortError")); }); });
    const R = (b, s) => new win.Response(typeof b === "string" ? b : JSON.stringify(b), { status: s, headers: { "Content-Type": "application/json" } });
    if (net.mode === "down") throw new TypeError("Failed to fetch");
    if (net.mode === "400") return R({ ok: false, error: "Please check your email address." }, 400);
    if (net.mode === "429") return R({ ok: false, error: "You've sent a few messages already. Please try again in an hour." }, 429);
    if (net.mode === "500") return R("<html>Server error</html>", 500);
    return R({ ok: true }, 200);
  };
  return net;
}
const type = (win, input, value) => { input.value = value; input.dispatchEvent(new win.Event("input", { bubbles: true })); };

const SCENARIOS = {
  async all({ win, doc, api }) {
    const net = mockNet(win);
    const sheet = () => $(doc, "#feedbackSheet");
    const open = () => sheet() && !sheet().hidden;
    const S = () => sheet();
    const field = sel => S().querySelector(sel);
    const submit = () => S().querySelector("form").dispatchEvent(new win.Event("submit", { cancelable: true, bubbles: true }));
    // --- the row in Settings
    const row = $(doc, "#feedbackRow");
    const open0 = row.querySelector("button");
    check("Settings > About has a Send feedback button", open0 && /^Send feedback$/.test(txt(open0)) && /We read every message/.test(txt(row)), txt(row));
    $(doc, "#openSettings").click();
    await wait(300);
    const r0 = open0.getBoundingClientRect();
    check("the button is at least 44 px tall", r0.height >= 43.5, String(Math.round(r0.height)));
    // --- open the sheet
    api.ui.go("drive");
    open0.click();
    await wait(300);
    check("the sheet opens", open());
    const sheetText = txt(S());
    log("sheet", sheetText);
    check("plain words at the top and under the email", /Tell us what you think\. We read every message\./.test(sheetText) && /We use your email only to reply to you\./.test(sheetText));
    check("Name is optional", /Name \(optional\)/.test(txt(field("label[for=fbName]"))) && !field("#fbName").required && field("#fbName").maxLength === 80);
    check("Email is required and type=email", field("#fbEmail").type === "email" && field("#fbEmail").required && field("#fbEmail").maxLength === 120 && field("#fbEmail").autocomplete === "email");
    check("Message is required, up to 2000 characters, with a counter", field("#fbMsg").required && field("#fbMsg").maxLength === 2000 && txt(field("#fbCount")) === "0 / 2,000", txt(field("#fbCount")));
    const hp = field("input[name=website]");
    const hpr = hp.getBoundingClientRect();
    check("the honeypot is empty, not focusable, not announced and off screen", hp.value === "" && hp.tabIndex === -1 && hp.autocomplete === "off" && hp.closest("[aria-hidden=true]") && (hpr.right < 0 || hpr.width <= 2), `${hp.tabIndex} ${hp.autocomplete} ${Math.round(hpr.left)}`);
    check("nothing has been sent just by opening it", net.calls.length === 0);
    // --- validation
    submit();
    await wait(100);
    check("empty form: nothing sent, email and message explain, focus on email", net.calls.length === 0 && /add your email/.test(txt(field("#fbEmailErr"))) && /write a message/.test(txt(field("#fbMsgErr"))) && field("#fbEmail").getAttribute("aria-invalid") === "true" && doc.activeElement === field("#fbEmail"), `${txt(field("#fbEmailErr"))} | ${txt(field("#fbMsgErr"))}`);
    type(win, field("#fbEmail"), "not an email");
    type(win, field("#fbMsg"), "   ");
    submit();
    await wait(100);
    check("a bad email and a blank message are refused with plain words", net.calls.length === 0 && /doesn't look right/.test(txt(field("#fbEmailErr"))) && /write a message/.test(txt(field("#fbMsgErr"))));
    check("typing clears the errors", (type(win, field("#fbEmail"), "a@b.co"), field("#fbEmailErr").hidden));
    type(win, field("#fbMsg"), "x".repeat(2001));
    submit();
    await wait(100);
    check("a message over 2000 characters is refused", net.calls.length === 0 && /under 2,000 characters/.test(txt(field("#fbMsgErr"))), txt(field("#fbMsgErr")));
    type(win, field("#fbMsg"), "abcde");
    check("the counter follows the typing", txt(field("#fbCount")) === "5 / 2,000", txt(field("#fbCount")));
    type(win, field("#fbName"), "n".repeat(81));
    submit();
    await wait(100);
    check("a name over 80 characters is refused", net.calls.length === 0 && /under 80 characters/.test(txt(S().querySelector(".fb-err:not([hidden])"))), txt(S().querySelector(".fb-err:not([hidden])")));
    // --- a draft is kept locally (and nothing is sent)
    type(win, field("#fbName"), "  Ada  ");
    type(win, field("#fbEmail"), "ada@example.com");
    type(win, field("#fbMsg"), "I love the Grapevine stories.\nMore, please.");
    await wait(500);
    const draft = JSON.parse(localStorage.getItem("i5b:feedback:draft") || "null");
    check("an unsent draft is kept on the phone", draft && draft.email === "ada@example.com" && /Grapevine/.test(draft.message), JSON.stringify(draft));
    api.ui.closeSheet();
    open0.click();
    await wait(200);
    check("reopening shows the draft again", field("#fbEmail").value === "ada@example.com" && /More, please/.test(field("#fbMsg").value) && field("#fbName").value.trim() === "Ada");
    check("still nothing sent", net.calls.length === 0);
    // --- offline: Send is off and says why
    NAV(win, "onLine", false);
    win.dispatchEvent(new win.Event("offline"));
    await wait(100);
    check("offline: Send is disabled and says why", field(".fb-send").disabled && /You're offline\. Connect to send\./.test(txt(field(".fb-status"))), txt(field(".fb-status")));
    submit();
    await wait(100);
    check("offline: submitting sends nothing", net.calls.length === 0);
    NAV(win, "onLine", true);
    win.dispatchEvent(new win.Event("online"));
    await wait(100);
    check("online again: Send works", !field(".fb-send").disabled && !/offline/.test(txt(field(".fb-status"))));
    // --- the server says no: its words, text kept
    net.mode = "400";
    type(win, field("input[name=website]"), "");
    field(".fb-send").click();
    await wait(60);
    check("while sending: button disabled, 'Sending…' shown", field(".fb-send").disabled && /Sending/.test(txt(field(".fb-send"))) && /Sending/.test(txt(field(".fb-status"))) && field("form").getAttribute("aria-busy") === "true");
    await wait(500);
    check("a 400 shows the server's own words and keeps the text", /Please check your email address\./.test(txt(field(".fb-status"))) && field("#fbMsg").value.includes("Grapevine") && !field(".fb-send").disabled, txt(field(".fb-status")));
    net.mode = "429";
    field(".fb-send").click();
    await wait(600);
    check("a 429 shows its words too", /sent a few messages already/.test(txt(field(".fb-status"))), txt(field(".fb-status")));
    net.mode = "500";
    field(".fb-send").click();
    await wait(600);
    check("a server error with no JSON gets plain words", /didn't go through\. Please try again/.test(txt(field(".fb-status"))), txt(field(".fb-status")));
    net.mode = "down";
    field(".fb-send").click();
    await wait(600);
    check("no connection to the server: plain words, text kept", /didn't go through\. Check your connection/.test(txt(field(".fb-status"))) && field("#fbMsg").value.length > 10, txt(field(".fb-status")));
    net.mode = "hang";
    field(".fb-send").click();
    await wait(16000);
    check("a request that never answers is given up after 15 seconds", /took too long/.test(txt(field(".fb-status"))) && !field(".fb-send").disabled, txt(field(".fb-status")));
    check("every try went to the same place, nothing extra", net.calls.length === 5 && net.calls.every(c => c.url === "https://i5.dominares.org/api/feedback" && c.method === "POST"), String(net.calls.length));
    // --- success
    net.mode = "ok";
    const before = net.calls.length;
    field(".fb-send").click();
    await wait(600);
    const c = net.calls[before];
    const body = JSON.parse(c.body);
    check("the request is JSON with exactly name, email, message, version, website", JSON.stringify(Object.keys(body)) === JSON.stringify(["name", "email", "message", "version", "website"]) && /json/i.test(JSON.stringify(c.headers)), JSON.stringify(Object.keys(body)));
    check("name is trimmed, email as typed, message in full, website empty", body.name === "Ada" && body.email === "ada@example.com" && body.message === "I love the Grapevine stories.\nMore, please." && body.website === "", JSON.stringify(body));
    const swVersion = ((await (await fetch("../sw.js")).text()).match(/VERSION\s*=\s*"i5b-v([\w.-]+)"/) || [])[1];
    check("the version is the service worker's VERSION", swVersion && body.version === swVersion && /^\d+\.\d+\.\d+$/.test(body.version), `${body.version} vs ${swVersion}`);
    check("success: thanks, in plain words", /Thanks\./.test(txt(S())) && /Your message is on its way to the Dominares team\./.test(txt(S())) && !S().querySelector("form"), txt(S()).slice(0, 120));
    check("name and email are remembered, the draft is gone", (() => { const w = JSON.parse(localStorage.getItem("i5b:feedback:who") || "null"); return w && w.name === "Ada" && w.email === "ada@example.com" && localStorage.getItem("i5b:feedback:draft") == null; })());
    S().querySelector(".fb-done .primary").click();
    await wait(100);
    check("Done closes the sheet", !open());
    open0.click();
    await wait(200);
    check("next time name and email are filled in, the message is empty", field("#fbName").value === "Ada" && field("#fbEmail").value === "ada@example.com" && field("#fbMsg").value === "" && txt(field("#fbCount")) === "0 / 2,000");
    // --- a bot fills the trap: it goes through as typed, so the server can drop it
    type(win, field("#fbMsg"), "hello");
    type(win, field("input[name=website]"), "http://spam.example");
    field(".fb-send").click();
    await wait(500);
    check("a filled honeypot is sent as it is (the server discards it)", JSON.parse(net.calls[net.calls.length - 1].body).website === "http://spam.example");
    // --- layout
    api.ui.closeSheet();
    open0.click();
    await wait(200);
    const small = [...S().querySelectorAll("button, input:not([name=website]), textarea, a")].filter(b => b.offsetParent).map(b => [b, b.getBoundingClientRect()]).filter(([, q]) => q.height < 43.5 || q.width < 43.5);
    check("sheet touch targets are at least 44 px", !small.length, small.map(([b, q]) => `${b.tagName} ${Math.round(q.width)}x${Math.round(q.height)}`).join(", "));
    check("sheet has no horizontal overflow", S().scrollWidth <= S().clientWidth + 1, `${S().scrollWidth} vs ${S().clientWidth}`);
    check("no em dashes and no exclamation marks in the sheet", !/[—!]/.test(txt(S())), txt(S()));
    check("every field has a label", ["fbName", "fbEmail", "fbMsg"].every(id => S().querySelector(`label[for=${id}]`)));
  },
  async view({ win, doc, api }) {
    const v = Q.get("view") || "form";
    const net = mockNet(win);
    const o = $(doc, "#feedbackRow button");
    api.ui.go("drive");
    o.click();
    await wait(300);
    const S = $(doc, "#feedbackSheet"), q = sel => S.querySelector(sel);
    if (v !== "form") {
      type(win, q("#fbName"), "Ada");
      type(win, q("#fbEmail"), v === "error" ? "ada@example" : "ada@example.com");
      type(win, q("#fbMsg"), "Your Grapevine story made the drive fly by. Could the Road ahead chart say which pass is steepest?");
    }
    if (v === "error") q("form").dispatchEvent(new win.Event("submit", { cancelable: true, bubbles: true }));
    if (v === "offline") { NAV(win, "onLine", false); win.dispatchEvent(new win.Event("offline")); }
    if (v === "done") { q(".fb-send").click(); await wait(600); }
    await wait(400);
    check("view ready", true);
  },
};

(async () => {
  try {
    const ctx = await boot();
    await SCENARIOS[SCEN](ctx);
    if (SCEN === "all") {
      const de = ctx.doc.documentElement;
      check("no horizontal page scroll", de.scrollWidth <= de.clientWidth, `${de.scrollWidth} vs ${de.clientWidth}`);
    }
  } catch (e) {
    check("test ran", false, String((e && e.stack) || e).replace(/\n\s*/g, " | "));
  }
  finish();
})();
</script>
</body>
</html>
