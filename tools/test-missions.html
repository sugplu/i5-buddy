<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missions module test</title>
<!--
  Tests js/missions.js (I-5 Buddy 2.6.0) on its own, with a synthetic road and three fake missions defined in this page
  (data.MISSIONS, and I-5 places with "mission": n and a "detour" for their turn-offs; it does not need the real data or
  the core's containers: it makes #missionCard, #missionsPassport and #missionSheet itself)
  and a fake api whose voice only records what would be said. Nothing here can make a sound: the page sets
  window.__BUDDY_SILENT__ first, never loads js/voice.js, and stubs speechSynthesis and AudioContext.
  Each scene runs in a fresh iframe (a fresh copy of the module, a phone-width viewport, its own theme).
  Results: bottom bar + console "[test-missions] ...".
  ?s=       all (default: every scene, the layout one at 360 px in both themes) | passport | visit | nearest | kid |
            sheet | layout | shot (leaves one state up for a screenshot: &show=at|near|list|kid|passport|sheet)
  ?theme=   dark | light (single scenes and shot)      ?w=  iframe width for a single scene or shot (default 390)
  Checks:
  passport  21-slot board logic on 3 missions: founding order (not road order), number, name and year on each stamp,
            "0 of 3" progress and progressbar; a GPS stamp within 300 m (stored with t, "gps" and the place id, the
            mission:stamp event, drawn inked and rotated); "I visited" in the sheet (stored as "self", drawn dashed, not
            inked), taking it back, focus back on the stamp when the sheet closes; the share line through Web Share and
            through api.share.shareText; GPS confirming a tap stamp; passport:reset clears it all.
  visit     "You are at Mission X" within 300 m: welcome text, visit text, facts, hours and site links, the next
            nearest mission with distance, compass word and Directions; one welcome per visit (mission:<n>:visit,
            prio 1, said once, not after walking 450 m off and back, not after a reload); narration off says nothing;
            the nearby card while driving (distance, turnoff, no speech); the core's mission:near for a mission with
            no coordinates; off the road shows the nearest list.
  nearest   api.missions.nearest(lat, lon, n) order and miles; the list card when parked (two rows, distance and
            compass, Directions to maps.apple.com on Apple devices and google.com/maps elsewhere); hidden while driving
            on the road away from missions; shown off the road; hidden with no position.
  kid       Kid mode's Mission fact button: on and off with settings.kid, speaks one short fact (mission:<n>:fact) after
            voice.unlock(), shows the same words, a new fact on each tap, works with narration off, in the sheet too;
            Hear it.
  sheet     the mission page: photo (api.ui.photo), facts, visit text, turnoff, I visited, Directions, Official site,
            Hours, Close; the Mission page button on main.js's place sheet (place:sheet); the module adds
            css/missions.css when the page has no link to it.
  layout    at 360 px, dark and light: no horizontal scroll in the card, passport and sheet, every button and link at
            least 44 px, theme colours from app.css tokens, a prefers-reduced-motion rule, no em dashes and no
            exclamation marks in what the module shows or says.
-->
<script>
  // Silent first: this page never loads js/voice.js, and nothing it runs may reach the speakers.
  window.__BUDDY_SILENT__ = true;
  try { if (window.speechSynthesis) { window.speechSynthesis.speak = function () {}; } } catch (e) {}
  try { window.AudioContext = undefined; window.webkitAudioContext = undefined; } catch (e) {}
</script>
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../css/missions.css" id="msCss">
<style>
  html.outer,html.outer body{margin:0;background:#2b2f2d;color:#e8ece9;font:12px/1.35 ui-monospace,Menlo,monospace}
  html.outer .app{display:none}
  #frames{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;padding:0 0 34px}
  #frames iframe{border:0;background:#000;display:block}
  #bar{position:fixed;left:0;right:0;bottom:0;height:26px;padding:6px 8px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#111;color:#e8ece9;font:12px/1.35 ui-monospace,Menlo,monospace;z-index:99}
  #bar.pass{background:#0b6e3f}
  #bar.fail{background:#9b1d16}
  html.inner #bar,html.inner #frames{display:none}
  html.inner body{margin:0}
  html.inner .app{margin:0;max-width:none}
</style>
</head>
<body>
<div id="frames"></div>
<div id="bar">starting…</div>
<script type="module">
const Q = new URLSearchParams(location.search);
const FRAME = Q.get("frame");
const THEME = Q.get("theme") || "dark";
const SHOW = Q.get("show") || "at";
const log = (...a) => console.log("[test-missions] " + a.map(x => (typeof x === "string" ? x : JSON.stringify(x))).join(" "));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* =====================================================================================================
   OUTER: run each scene in a fresh iframe and collect the results
   ===================================================================================================== */
if (!FRAME) {
  document.documentElement.classList.add("outer");
  const SCEN = Q.get("s") || "all", W = +(Q.get("w") || 390);
  const jobs = SCEN === "all"
    ? [["passport", 390, "dark"], ["visit", 390, "dark"], ["nearest", 390, "dark"], ["kid", 390, "dark"], ["sheet", 390, "dark"],
      ["layout", 360, "dark"], ["layout", 360, "light"]]
    : [[SCEN, SCEN === "layout" && !Q.get("w") ? 360 : W, THEME]];
  const all = [];
  const frames = document.getElementById("frames");
  for (const [scene, w, theme] of jobs) {
    const f = document.createElement("iframe");
    f.title = `missions ${scene}`;
    f.style.width = w + "px";
    f.style.height = (scene === "shot" ? +(Q.get("h") || 1400) : 900) + "px";
    const got = new Promise(res => {
      const on = e => { if (e.source === f.contentWindow && e.data && e.data.type === "missions-done") { removeEventListener("message", on); res(e.data); } };
      addEventListener("message", on);
      setTimeout(() => { removeEventListener("message", on); res({ checks: [[`${scene} finished in time`, false, "no result"]] }); }, 30000);
    });
    f.src = `test-missions.html?frame=${scene}&theme=${theme}&show=${encodeURIComponent(SHOW)}`;
    frames.append(f);
    const r = await got;
    for (const [name, ok, extra] of r.checks) all.push([`${scene}${scene === "layout" ? " " + theme : ""}: ${name}`, ok, extra]);
    if (SCEN === "all") f.remove();
  }
  const bad = all.filter(c => !c[1]);
  const bar = document.getElementById("bar");
  bar.className = bad.length ? "fail" : "pass";
  bar.textContent = `${SCEN} · ${all.length - bad.length}/${all.length} pass${bad.length ? " · FAIL: " + bad.map(c => c[0]).join(", ") : ""}`;
  for (const c of bad) log(`FAIL ${c[0]}${c[2] ? " · " + c[2] : ""}`);
  log(bad.length ? `RESULT FAILED ${bad.length} of ${all.length}` : `RESULT ALL PASS (${all.length})`);
  document.title = bad.length ? `Missions test FAILED ${bad.length}` : `Missions test ALL PASS (${all.length})`;
} else {
  document.documentElement.classList.add("inner");
  document.documentElement.dataset.theme = THEME;
  runFrame().catch(e => {
    console.error("[test-missions] scene crashed", e && e.message ? e.message : e);
    parent.postMessage({ type: "missions-done", checks: [[`${FRAME} ran without throwing`, false, String(e && e.stack || e).slice(0, 300)]] }, "*");
  });
}

/* =====================================================================================================
   INNER: one scene
   ===================================================================================================== */
async function runFrame() {
  const checks = [];
  const check = (name, ok, extra = "") => { checks.push([name, !!ok, extra]); log(`${ok ? "PASS" : "FAIL"} ${FRAME}: ${name}${extra ? " · " + extra : ""}`); };
  const errors = [];
  const origErr = console.error.bind(console);
  console.error = (...a) => { if (String(a[0] || "").startsWith("[missions]")) errors.push(a.map(String).join(" ")); origErr(...a); };

  /* ---------- the synthetic road and its three missions ---------- */
  const LAT0 = 33.9, LON0 = -118.0, MI_PER_DEG = 69.05;
  const roadLat = m => LAT0 + m / MI_PER_DEG;
  const hav = (lat1, lon1, lat2, lon2) => {
    const r = Math.PI / 180;
    const a = Math.sin((lat2 - lat1) * r / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
    return 2 * 6371008.8 * Math.asin(Math.min(1, Math.sqrt(a))) / 1609.344;
  };
  const north = (lat, meters) => lat + meters / 111320;
  const IMG = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#9fc4de"/><rect y="200" width="400" height="100" fill="#c9a27a"/><path d="M70 230V130l50-36 50 36v100Z" fill="#f4ead8"/><path d="M170 230V150h170v80Z" fill="#efe2c8"/><path d="M60 136l60-46 60 46" fill="none" stroke="#a5532a" stroke-width="10"/><rect x="108" y="120" width="24" height="30" fill="#7a4a24"/></svg>');
  const MISSIONS = [
    { n: 1, id: "msn-prueba", name: "Mission San Prueba", name_es: "Misión San Prueba de los Ensayos", lat: 34.0014, lon: -117.99, founded: "1771-09-08",
      founder: "Junípero Serra", people: "Tongva", status: "Active parish church", site: "https://example.org/prueba", hours: "https://example.org/prueba/hours",
      text: "The first test mission, with a bell wall facing the road.",
      visit: "Walk through the garden to the old church. Mass is still said here, so keep your voice low inside." },
    { n: 2, id: "msn-ejemplo", name: "Mission Santa Ejemplo", name_es: "Misión Santa Ejemplo", lat: 33.9724, lon: -118.0255, founded: 1772,
      founder: "Junípero Serra", people: "Chumash", status: "Museum and parish", site: "https://example.org/ejemplo", hours: "Daily 9 to 5",
      text: "A test mission on a quiet hill, rebuilt twice after earthquakes.",
      visit: "Start in the museum by the gate, then walk the long arcade to the garden." },
    { n: 3, id: "msn-falso", name: "Mission San Falso", name_es: "Misión San Falso", lat: 34.3058, lon: -118.15, founded: 1790,
      founder: "Fermín Lasuén", people: "Salinan", status: "State historic park",
      text: "The far test mission, out in the oak hills.", visit: "The park has a short loop trail past the old water system." },
  ];
  const MS = n => MISSIONS.find(m => m.n === n);
  // the I-5 places: one plain landmark, and the turn-offs to the missions (as tools/build.py makes them)
  const PLACES = [
    { id: "x-road-sign", m: 2, st: "CA", ex: "2", name: "A big road sign", cat: "odd", side: 1, vis: true, text: "Not a mission at all.", lat: roadLat(2), lon: LON0 + 0.004 },
    { id: "ca5-mission-santa-ejemplo", m: 5, st: "CA", ex: "5", name: "Mission Santa Ejemplo", cat: "hist", side: -1, vis: false, off: 1.5, lat: 33.9724, lon: -118.0255,
      text: "A test mission on a quiet hill.", detour: { exit: "5", road: "Ejemplo Avenue", dir: "west", miles: 1.5 }, mission: 2 },
    { id: "ca7-mission-san-prueba", m: 7, st: "CA", ex: "7", name: "Mission San Prueba", cat: "hist", side: 1, vis: false, off: 0.6, lat: 34.0014, lon: -117.99,
      img: { f: IMG, w: 400, h: 300, by: "Test picture", lic: "CC0", url: "https://example.org/photo" },
      text: "The first test mission.", detour: { exit: "7", road: "Prueba Road", dir: "east", miles: 0.6 }, mission: 1 },
    { id: "ca28-mission-san-falso", m: 28, st: "CA", ex: "28", name: "Mission San Falso", cat: "hist", side: -1, vis: false, off: 9.2, lat: 34.3058, lon: -118.15,
      text: "The far test mission.", detour: { exit: "28", road: "Highway 99", dir: "west", miles: 9.2 }, mission: 3 },
  ];
  const ROAD = n => PLACES.find(p => p.mission === n);
  // data.js's turn-off helpers, as the app has them (js/data.js detourOf, detourSentence)
  const DIRW = { n: "north", s: "south", e: "east", w: "west" };
  const detourOf = p => {
    const d = p && p.detour;
    if (!d || !d.exit) return null;
    const w = String(d.dir || "").toLowerCase();
    return { exit: String(d.exit), road: String(d.road || ""), dir: DIRW[w] || w, miles: typeof d.miles === "number" ? d.miles : null };
  };
  const detourSentence = p => {
    const d = detourOf(p);
    if (!d) return "";
    const v = d.miles != null ? (d.miles < 10 ? Math.round(d.miles * 10) / 10 : Math.round(d.miles)) : null;
    const far = v != null ? `about ${v} ${v === 1 ? "mile" : "miles"}${d.dir ? " " + d.dir : ""}` : d.dir;
    return d.road ? `At exit ${d.exit}, ${d.road} heads ${far ? far + " " : ""}to ${p.name}.` : `Take exit ${d.exit} for ${p.name}${far ? `, ${far}` : ""}.`;
  };
  const at = (n, meters = 100) => { const p = MS(n); return [north(p.lat, meters), p.lon]; };

  /* ---------- the page and a fake api ---------- */
  function scaffold() {
    document.getElementById("app")?.remove();
    const app = document.createElement("div");
    app.className = "app"; app.id = "app";
    app.innerHTML = `
      <main id="main">
        <section class="view" id="view-drive" data-view="drive">
          <article class="next" id="nextCard" style="--c:var(--hist)"><div class="next-body"><div class="meta"><span>Next landmark</span></div><h2>A test landmark</h2><p>The next-landmark card sits here.</p></div></article>
          <div id="missionCard"></div>
        </section>
        <section class="view" id="view-passport" data-view="passport" hidden>
          <div id="missionsPassport"></div>
          <p class="hint">The rest of the passport (trip.js) goes here.</p>
        </section>
      </main>
      <div class="sheet-back" id="sheetBack" hidden></div>
      <aside class="sheet" id="missionSheet" hidden role="dialog" aria-modal="true" aria-label="Mission"></aside>
      <div class="toast" id="toast" hidden></div>`;
    document.body.prepend(app);
    return app;
  }
  function makeApi(mem = new Map()) {
    const handlers = new Map(), emitted = [], said = [], toasts = [];
    const bus = {
      on(e, fn) { if (!handlers.has(e)) handlers.set(e, new Set()); handlers.get(e).add(fn); return () => handlers.get(e).delete(fn); },
      off(e, fn) { handlers.get(e)?.delete(fn); },
      emit(e, d) { emitted.push([e, d]); for (const fn of [...(handlers.get(e) || [])]) { try { fn(d); } catch (err) { console.error("[bus]", err); } } },
    };
    const store = {
      get(k, f) { return mem.has(k) ? JSON.parse(mem.get(k)) : f; },
      set(k, v) { mem.set(k, JSON.stringify(v)); },
      del(k) { mem.delete(k); },
    };
    const voice = {
      available: true, unlocks: 0,
      say(text, o = {}) { said.push({ text, ...o }); return Promise.resolve(true); },
      unlock() { voice.unlocks++; }, chime() { return Promise.resolve(); }, stop() {}, hold() {},
      isSpeaking: () => false, currentId: () => null, queued: () => [], isHeld: () => false,
    };
    const S = { mode: "off", m: null, dir: "N", speed: null, heading: null, lat: null, lon: null, offRoute: false, accuracy: null, stamps: {}, dest: null };
    const settings = { narr: true, zoneNarr: true, kid: false, chime: true, theme: THEME, cats: new Set(["hist"]) };
    let openEl = null;
    const ui = {
      $: id => document.getElementById(id),
      toast(t) { toasts.push(t); const e = document.getElementById("toast"); if (e) { e.textContent = t; e.hidden = false; } },
      openSheet(sh) { ui.closeSheet(); sh.hidden = false; document.getElementById("sheetBack").hidden = false; openEl = sh; const f = sh.querySelector("button, select, input, a"); if (f) f.focus({ preventScroll: true }); },
      closeSheet() { if (openEl) openEl.hidden = true; document.getElementById("sheetBack").hidden = true; openEl = null; },
      photo(p, size = "hero") {
        if (!p.img) return null;
        const fig = document.createElement("figure"); fig.className = "photo " + size;
        const img = document.createElement("img"); img.src = p.img.f; img.alt = p.name; img.width = p.img.w; img.height = p.img.h;
        fig.append(img); return fig;
      },
      go() {}, placeSheet() {}, queueRender() {},
    };
    const data = {
      PLACES, MISSIONS, detourOf, detourSentence,
      CATS: { hist: "History", odd: "Oddities" }, CAT_ICON: { hist: "🏛", odd: "✨" },
      aheadOf: (m, dir, x) => (dir === "N" ? x - m : m - x),
      sideWord: (p, dir) => (!p.side ? "" : (p.side === 1) === (dir === "N") ? "right" : "left"),
      placeById: id => PLACES.find(p => p.id === id),
    };
    const geo = { coordAt: m => [roadLat(m), LON0], miles: hav };
    const selfStamps = [];
    const narrator = { stampSelf(p) { if (S.stamps[p.id]) return false; S.stamps[p.id] = Date.now(); selfStamps.push(p.id); bus.emit("place:stamp", { place: p, how: "self" }); return true; } };
    return { S, settings, saveSettings() { bus.emit("settings", settings); }, bus, store, voice, narrator, data, geo, ui, emitted, said, toasts, mem, selfStamps };
  }
  let instance = 0;
  async function boot(mem) {
    const app = scaffold();
    const api = makeApi(mem);
    const mod = await import(`../js/missions.js?i=${FRAME}-${++instance}`);
    mod.init(api);
    await wait(30);
    return { api, app, mod };
  }
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const txt = n => (n ? n.textContent.replace(/\s+/g, " ").trim() : "");
  const gps = (api, [lat, lon], extra = {}) => {
    const first = api.S.mode !== "gps";
    Object.assign(api.S, { mode: "gps", lat, lon, accuracy: 15, speed: 0, offRoute: true }, extra);
    if (first) api.bus.emit("mode", "gps");
    api.missions.check();
  };
  const stampEl = n => $(`#missionsPassport [data-k="ms:${n}"]`);
  const kind = api => api.missions.state().kind;
  const big = el => { const r = el.getBoundingClientRect(); return r.height >= 43.5 && r.width >= 43.5; };

  const SCENES = {
    /* ---------------------------------------------------------------------------------- passport */
    async passport() {
      const { api } = await boot();
      $("#view-passport").hidden = false;
      api.bus.emit("tab", "passport");
      await wait(20);
      const ks = $$("#missionsPassport .ms-stamp").map(b => b.dataset.k);
      check("three stamps in founding order, not road order", JSON.stringify(ks) === '["ms:1","ms:2","ms:3"]', JSON.stringify(ks));
      check("api.missions.list() is in founding order", api.missions.list().map(p => p.id).join() === "msn-prueba,msn-ejemplo,msn-falso");
      const names = $$("#missionsPassport .ms-nm").map(txt), years = $$("#missionsPassport .ms-yr").map(txt), nums = $$("#missionsPassport .ms-ring b").map(txt);
      check("each stamp has its number, name and founding year", names.join("|") === "San Prueba|Santa Ejemplo|San Falso" && years.join() === "1771,1772,1790" && nums.join() === "1,2,3", `${names} ${years} ${nums}`);
      check("progress says 0 of 3", txt($(".ms-pp-count")) === "0 of 3", txt($(".ms-pp-count")));
      const bar = $(".ms-bar");
      check("progressbar 0 of 3", bar.getAttribute("role") === "progressbar" && bar.getAttribute("aria-valuenow") === "0" && bar.getAttribute("aria-valuemax") === "3");
      check("nothing stamped yet", !$("#missionsPassport .ms-stamp.got") && /I visited/.test(txt($(".ms-legend"))) && !$(".ms-share"), txt($(".ms-legend")));
      check("a stamp reads well to a screen reader", stampEl(1).getAttribute("aria-label") === "1. Mission San Prueba, founded 1771. Not visited yet.", stampEl(1).getAttribute("aria-label"));

      // GPS: within 300 m of mission 2
      gps(api, at(2, 100), { accuracy: 25 });
      const s2 = api.missions.stamps()["2"];
      check("GPS within 300 m stamps it, stored with time and gps", s2 && s2.how === "gps" && Date.now() - s2.t < 10000 && s2.id === "msn-ejemplo", JSON.stringify(s2));
      check("the stamp is saved through api.store", /"2":\{"t":\d+,"how":"gps","id":"msn-ejemplo"\}/.test(api.mem.get("missionStamps") || ""), api.mem.get("missionStamps"));
      check("mission:stamp event with how gps", api.emitted.some(([e, d]) => e === "mission:stamp" && d.n === 2 && d.how === "gps" && d.place.id === "msn-ejemplo"));
      check("progress says 1 of 3", txt($(".ms-pp-count")) === "1 of 3" && $(".ms-bar").getAttribute("aria-valuenow") === "1");
      const today = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" });
      check("the GPS stamp is inked with the date", stampEl(2).classList.contains("gps") && stampEl(2).classList.contains("got") && txt(stampEl(2).querySelector(".ms-when")) === today && /Stamped by GPS on /.test(stampEl(2).getAttribute("aria-label")), stampEl(2).className + " " + txt(stampEl(2).querySelector(".ms-when")));
      check("a fuzzy fix (900 m accuracy) does not stamp", (() => { gps(api, at(1, 50), { accuracy: 900 }); return !api.missions.stamps()["1"]; })());
      Object.assign(api.S, { mode: "off", lat: null, lon: null }); api.bus.emit("mode", "off");

      // I visited, from the mission page
      stampEl(3).focus();
      stampEl(3).click();
      await wait(20);
      const sheet = $("#missionSheet");
      check("tapping a stamp opens the mission page", !sheet.hidden && txt($("#msSheetTitle")) === "Mission San Falso");
      let vb = $("#missionSheet .ms-visited");
      check("it offers I visited", vb && txt(vb) === "I visited" && vb.getAttribute("aria-pressed") === "false");
      vb.click();
      await wait(20);
      const s3 = api.missions.stamps()["3"];
      vb = $("#missionSheet .ms-visited");
      check("I visited stores a self stamp", s3 && s3.how === "self" && s3.t > 0, JSON.stringify(s3));
      check("and stamps its I-5 turn-off place too (narrator.stampSelf)", api.selfStamps.includes("ca28-mission-san-falso"), api.selfStamps.join());
      check("the button now says Visited (pressed) and keeps focus", vb && txt(vb) === "Visited" && vb.getAttribute("aria-pressed") === "true" && document.activeElement === vb);
      check("progress says 2 of 3, and a toast says so", txt($(".ms-pp-count")) === "2 of 3" && /2 of 3/.test(api.toasts.at(-1) || ""), api.toasts.at(-1));
      const ringG = stampEl(2).querySelector(".ms-ring"), ringS = stampEl(3).querySelector(".ms-ring");
      const cg = getComputedStyle(ringG), cs = getComputedStyle(ringS);
      check("a self stamp is drawn differently: dashed and not inked", stampEl(3).classList.contains("self") && cs.borderTopStyle === "dashed" && cg.borderTopStyle === "double" && cs.backgroundColor !== cg.backgroundColor && /Stamped by GPS|You marked it visited/.test(stampEl(3).getAttribute("aria-label")), `${cg.borderTopStyle}/${cs.borderTopStyle} ${cg.backgroundColor}/${cs.backgroundColor}`);
      check("its label says you marked it", /You marked it visited on /.test(stampEl(3).getAttribute("aria-label")) && txt(stampEl(3).querySelector(".ms-when")) === "Visited");
      vb.click();
      await wait(20);
      check("tapping Visited again takes the stamp back", !api.missions.stamps()["3"] && txt($(".ms-pp-count")) === "1 of 3" && api.emitted.some(([e, d]) => e === "mission:unstamp" && d.n === 3));
      $("#missionSheet .ms-visited").click();
      await wait(20);
      $("#missionSheet .sheet-head .link").click();
      await wait(30);
      check("Close hides the page and focus goes back to the stamp", sheet.hidden && document.activeElement && document.activeElement.dataset.k === "ms:3", document.activeElement && document.activeElement.outerHTML.slice(0, 80));

      // share

      check("theme: surface and the mission colour (--hist) from app.css", cs.backgroundColor === T.surface && cs.borderTopColor === T.hist, `${cs.backgroundColor} ${cs.borderTopColor}`);
      const k = getComputedStyle($("#missionCard .ms-k"));
      check("kicker in the mission colour", k.color === T.hist, k.color);
      // passport
      $("#view-passport").hidden = false;
      api.bus.emit("tab", "passport");
      await wait(50);
      const pp = $("#missionsPassport .ms-pp");
      check("passport: no horizontal scroll", noScroll(document.documentElement) && noScroll(pp), `${pp.scrollWidth}/${pp.clientWidth}`);
      check("passport: stamps are 44 px", $$("#missionsPassport button").every(big));
      // sheet
      api.missions.open(1);
      await wait(50);
      const sh = $("#missionSheet");
      check("sheet: no horizontal scroll", noScroll(sh), `${sh.scrollWidth}/${sh.clientWidth}`);
      check("sheet: every button and link at least 44 px", [...sh.querySelectorAll("button, a.ms-btn")].every(big));
      // text style
      const said = api.said.map(s => s.text).join(" ");
      const shown = txt(app);
      check("no em dashes in anything shown or said", !/—/.test(shown + said));
      check("no exclamation marks in anything shown or said", !/!/.test(shown + said), (shown + said).match(/.{30}!.{0,10}/g)?.join(" | "));
      let reduced = false;
      for (const s of document.styleSheets) {
        if (!/missions\.css/.test(s.href || "")) continue;
        try { for (const r of s.cssRules) if (r.media && /prefers-reduced-motion/.test(r.media.mediaText) && /animation[^;]*none/.test(r.cssText)) reduced = true; } catch {}
      }
      check("prefers-reduced-motion turns the motion off", reduced);
      // the all-stamped celebration is the one place an exclamation mark belongs
      api.missions.visited(2); api.missions.visited(3);
      check("all stamped: one celebration toast", /^All 3 missions are in your passport\. What a journey!$/.test(api.toasts.at(-1) || ""), api.toasts.at(-1));
      check("no errors from the module", !errors.length, errors.join(" | ").slice(0, 200));
      return checks;
    },

    /* ---------------------------------------------------------------------------------- shot */
    async shot() {
      const { api } = await boot();
      $("#nextCard").hidden = SHOW === "passport";
      if (SHOW === "kid") api.settings.kid = true;
      if (SHOW === "at" || SHOW === "kid") {
        api.missions.visited(3);
        gps(api, at(1, 60));
        if (SHOW === "kid") { await wait(30); $("#missionCard .ms-factbtn").click(); }
      } else if (SHOW === "near") {
        Object.assign(api.S, { mode: "demo", m: 5.3, speed: 65, dir: "N" }); api.bus.emit("mode", "demo"); api.missions.check();
      } else if (SHOW === "list") {
        api.missions.visited(2);
        Object.assign(api.S, { mode: "off", m: 9 }); api.missions.check();
      } else if (SHOW === "passport") {
        gps(api, at(2, 40)); api.missions.visited(3);
        Object.assign(api.S, { mode: "off" }); api.bus.emit("mode", "off");
        $("#view-drive").hidden = true; $("#view-passport").hidden = false; api.bus.emit("tab", "passport");
      } else if (SHOW === "sheet") {
        api.missions.visited(1);
        Object.assign(api.S, { mode: "off", m: 20 }); api.missions.check();
        api.missions.open(1);
      }
      await wait(700);
      check(`shot ${SHOW} ready`, true);
      return checks;
    },
  };
  const scene = SCENES[FRAME];
  if (!scene) { check(`known scene ${FRAME}`, false); parent.postMessage({ type: "missions-done", checks }, "*"); return; }
  await scene();
  parent.postMessage({ type: "missions-done", checks }, "*");
}
</script>
</body>
</html>
