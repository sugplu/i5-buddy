<title>I-5 Buddy: listen tests</title>
<!--
  Voice command tests. Headless Chrome has no microphone, so a fake SpeechRecognition is put into the app's
  iframe and the real listen.js state machine is driven through it.

  ?state=selftest   runs the end-to-end checks (about 60 s of page time: use --virtual-time-budget=250000)
  ?state=drive|listening|heard|unknown|nospeech|network|answer|answered|help|reply|land|eta|past|blocked   shows one state for a screenshot
                    (default: listening). The parser tables always run, and the totals show in a thin line above the app.
  &theme=dark|light  &m=309  &dir=N|S  &delay=200 (ms to wait before driving the state)
  &at=12500 (drive the state at that page time, so a screenshot taken with --virtual-time-budget=15000 still shows the toast)
  &w=360 &h=380 (iframe size: narrow phone, or a phone on its side with &w=740&h=380)   &debug=1 (log the overlay's computed state)

  The app covers California (tools/build.py SCOPE = ["CA"]): the road ends at data.ENDS.N, data.MAX_M (the Oregon
  line), and places past it get a friendly "past the Oregon line" answer. Parser rows marked {whole: true} run with the
  whole road's destinations, so the same words still work if the scope grows again.

  The page prints PASS/FAIL tables, puts the totals in document.title and logs "LISTEN TEST" lines to the console.
  Speech is faked as well (headless stalls on real utterances), and the app runs without its service worker here
  (on a fresh profile the worker reloads the page, which would drop the fake microphone).
-->

/* ---------------- a fake microphone ---------------- */
class FakeSR {
  constructor() { FakeSR.last = this; this.lang = ""; this.interimResults = false; this.maxAlternatives = 1; this.continuous = false; this.phase = "new"; }
  start() {
    if (FakeSR.throwOnStart) throw new DOMException("denied", "NotAllowedError");
    this.phase = "started";
    setTimeout(() => { if (this.phase !== "started") return; this.onstart && this.onstart({}); this.onaudiostart && this.onaudiostart({}); }, 20);
  }
  stop() { if (this.phase === "ended") return; this.phase = "stopping"; setTimeout(() => this._end(), 30); }
  abort() { if (this.phase === "ended") return; this.onerror && this.onerror({ error: "aborted" }); this._end(); }
  _end() { if (this.phase === "ended") return; this.phase = "ended"; this.onend && this.onend({}); }
  /** Pretend the recognizer heard something. alts: a string or a list of alternatives. */
  hear(alts, final = false) {
    if (this.phase === "ended") return;
    const r = (Array.isArray(alts) ? alts : [alts]).map(t => ({ transcript: t, confidence: 0.8 }));
    r.isFinal = final;
    this.onspeechstart && this.onspeechstart({});
    this.onresult && this.onresult({ resultIndex: 0, results: [r] });
  }
  fail(code) { if (this.phase === "ended") return; this.onerror && this.onerror({ error: code }); setTimeout(() => this._end(), 20); }
}

/* ---------------- the app ---------------- */
// On a fresh profile the app's service worker claims the page and main.js reloads it, which would throw away the
// fake microphone (and installing it is erratic under headless virtual time). So the test app runs without it:
// right after the iframe navigates, before main.js runs, worker registration is made to fail (main.js ignores that).
// MessageChannel turns keep running while virtual time waits for the page to load; timers don't.
const frame = document.getElementById("app");
const nextTask = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
async function loadApp() {
  frame.src = "../index.html";
  for (let i = 0; i < 500000; i++) {
    let w = null;
    try { w = frame.contentWindow; if (!/\/index\.html$/.test(w.location.pathname)) w = null; } catch { w = null; }
    if (w) {
      try { if (w.navigator.serviceWorker) w.navigator.serviceWorker.register = () => Promise.reject(new Error("tests run without the service worker")); } catch { /* ignore */ }
      break;
    }
    await nextTask();
  }
  for (let round = 0; round < 3; round++) {
    const w = await appReady();
    w.document.addEventListener("visibilitychange", () => console.log("LISTEN TEST note: app visibility " + w.document.visibilityState));
    w.__listenTest = true;
    await sleep(300);
    if (frame.contentWindow.__listenTest) return frame.contentWindow; // still the same window
  }
  throw new Error("the app kept reloading");
}
async function appReady() {
  for (let attempt = 0; attempt < 2; attempt++) {
    for (let i = 0; i < 175; i++) {
      const w = frame.contentWindow;
      if (w && w.I5BUDDY && w.I5BUDDY.api && w.I5BUDDY.api.listen) return w;
      await sleep(40);
    }
    // headless sometimes stalls a load under virtual time; one fresh try
    console.log("LISTEN TEST note: app load stalled, reloading");
    try { frame.contentWindow.location.reload(); } catch { frame.src = "../index.html?retry=" + attempt; }
  }
  throw new Error("the app never exposed api.listen");
}
function withTimeout(p, ms) { return Promise.race([p, sleep(ms).then(() => "timeout")]); }

/* Headless Chrome's virtual clock stalls while a real utterance is pending, so speech is faked too:
   each utterance "plays" for a few ms per character, then fires onend like the real thing. */
function fakeVoice(w) {
  const s = w.speechSynthesis;
  if (!s) return;
  let busy = 0;
  const fake = {
    speak(u) {
      busy++;
      setTimeout(() => { busy--; try { u.onend && u.onend({}); } catch { /* ignore */ } }, Math.min(1200, 40 + String(u.text || "").length * 3));
    },
    cancel() {}, pause() {}, resume() {},
  };
  for (const k of Object.keys(fake)) { try { s[k] = fake[k]; } catch { /* read-only */ } }
  try { Object.defineProperty(s, "speaking", { configurable: true, get: () => busy > 0 }); } catch { /* ignore */ }
  try { Object.defineProperty(s, "paused", { configurable: true, get: () => false }); } catch { /* ignore */ }
}

    for (const t of ["what's on my left", "tell me more", "how far to Portland", "next gas", "what's the weather", "where are we", "say that again",
      "slower", "narration off", "tell me a joke", "fun fact", "what's that", "next exit", "how high are we", "answer b", "ask me trivia", "play", "help",
      "how far to Oregon", "how much time is left", "where is Redding", "what's growing here", "what's that castle", "what time will we get there",
      "how far to Seattle", "how far to the state line", "how far to Canada", "how far to the border", "when do we cross into Washington", "how far to Mexico",
      "how far to the end of the road", "what time will we get to Portland", "tell me about Tacoma", "how far to Corvallis"]) thin.listen.run(t);
    thin.listen.start();
    await sleep(60);
    FakeSR.last.hear("next gas", true);
    await sleep(500);
    const p = thin.listen.listenForAnswer(["a", "b"]);
    await sleep(60);
    FakeSR.last.fail("network");
    await sleep(100);
    e2e("empty api: answer still settles", (await withTimeout(p, 3000)) === null);
  } catch (e) { threw = e; }
  e2e("empty api: commands and listening never throw", !threw, threw && (threw.stack || threw.message));
  e2e("empty data: parser copes", parseCommand("how far to sacramento", []).cmd === "howfar" && parseAnswer("b", []) === null && parseCommand(null).cmd === "unknown");
  thin.listen.stop();
  await sleep(200);

  // Some data and no other modules: the answers about the ends of the road come from data.STATES, MAX_M and ENDS alone
  const replyText = () => { const a = document.querySelector("body > .lsn-reply .lsn-reply-a"); return a ? a.textContent : ""; };
  const ask = (api, text) => { api.listen.run(text); return replyText(); };
  const thinApi = (data, S) => ({ S, settings: {}, bus: { on() { return () => {}; }, emit() {} }, data: Object.assign({ PLACES: [], ROUTE: [] }, data), ui: {} });
  let threw2 = null, got;
  try {
    // California only, and no ENDS: the north end is still the Oregon line (tools/build.py names it the same way)
    const ca = thinApi({ STATES: [{ id: "CA", name: "California", from: 0, to: 796.973 }], MAX_M: 796.973,
      DESTS: [{ name: "Mexico border", m: 0 }, { name: "Sacramento", m: 519 }, { name: "Redding", m: 677 }, { name: "Oregon border", m: 797 }] }, { m: 700, dir: "N", mode: "gps" });
    initListen(ca);
    got = ask(ca, "how far to Portland");
    e2e("one state, no ENDS: 'how far to Portland'", got === "Portland is past the Oregon line. I-5 Buddy covers I-5 in California, and the Oregon line is about 97 miles away.", got);
    got = ask(ca, "how far to the state line");
    e2e("one state, no ENDS: 'how far to the state line'", got === "The Oregon line is about 97 miles ahead. That's the end of the road for I-5 Buddy.", got);
    got = ask(ca, "when do we cross into Washington");
    e2e("one state, no ENDS: Washington lies past the Oregon line", got === "Washington is past the Oregon line. I-5 Buddy covers I-5 in California, and the Oregon line is about 97 miles away.", got);
    ca.S.m = null;
    got = ask(ca, "how far to Oregon");
    e2e("one state, no position: where the road ends", got === "The Oregon line is at mile 797, the end of the road for I-5 Buddy. Start GPS or a demo drive and I'll count down to it.", got);
    got = ask(ca, "how far to Seattle");
    e2e("one state, no position: a city past the road", got === "Seattle is past the Oregon line. I-5 Buddy covers I-5 in California, from the Mexico border to the Oregon line.", got);

    // the whole road (tools/build.py SCOPE = ["CA", "OR", "WA"]): its state lines are on the road and its cities are destinations again
    const whole = thinApi({ STATES: [{ id: "CA", name: "California", from: 0, to: 796.973 }, { id: "OR", name: "Oregon", from: 796.973, to: 1105 },
      { id: "WA", name: "Washington", from: 1105, to: 1381.8 }], MAX_M: 1381.8, ENDS: { S: { short: "Mexico", long: "the Mexico border" }, N: { short: "Canada", long: "the Canadian border" } },
      DESTS: [{ name: "Mexico border", m: 0 }, { name: "Redding", m: 677 }, { name: "Portland", m: 1105 }, { name: "Seattle", m: 1270 }, { name: "Canadian border", m: 1381.8 }] },
      { m: 700, dir: "N", mode: "gps" });
    initListen(whole);
    got = ask(whole, "how far to Oregon");
    e2e("whole road: 'how far to Oregon' is a state line on the road", got === "The Oregon state line is about 97 miles ahead.", got);
    got = ask(whole, "how far to the state line");
    e2e("whole road: 'how far to the state line'", got === "The next state line is Oregon, about 97 miles ahead.", got);
    ask(whole, "how far to Portland");
    e2e("whole road: 'how far to Portland' sets the destination again", !!whole.S.dest && whole.S.dest.name === "Portland", show(whole.S.dest));
    ask(whole, "how far to the border");
    e2e("whole road: 'the border' going north is the Canadian border", !!whole.S.dest && whole.S.dest.name === "Canadian border", show(whole.S.dest));
    whole.S.m = 1300;
    got = ask(whole, "how far to the state line");
    e2e("whole road, in Washington: no more state lines, then the Canadian border",
      got === "There are no more state lines this way. The Canadian border is about 82 miles ahead. That's the end of the road for I-5 Buddy.", got);
    got = ask(whole, "how far to Corvallis");
    e2e("whole road: a town that is no destination", got === "I don't know exactly where Corvallis is on I-5. Try a city, like Redding.", got);
  } catch (e) { threw2 = e; }
  e2e("one-state and whole-road data: nothing throws", !threw2, threw2 && (threw2.stack || threw2.message));
  for (const el of document.querySelectorAll("body > .lsn, body > .lsn-reply, body > #micBtn")) el.remove();
  delete window.SpeechRecognition; delete window.webkitSpeechRecognition;
  window.SpeechRecognition = keep[0]; window.webkitSpeechRecognition = keep[1];
}

/* one state on screen, for screenshots */
async function showState(w, api, state) {
  api.listen.debug.hold = true;
  const doc = w.document;
  const tap = async () => { doc.getElementById("micBtn").click(); await sleep(60); return FakeSR.last; };
  const keep = (rec, text) => { const t = setInterval(() => { if (rec.phase === "ended") clearInterval(t); else rec.hear(text, false); }, 2000); };
  let rec;
  switch (state) {
    case "listening": rec = await tap(); rec.hear("how far to sacra", false); keep(rec, "how far to sacra"); break;
    case "heard": rec = await tap(); rec.hear("what's on my", false); await sleep(120); rec.hear("what's on my left", true); break;
    case "unknown": rec = await tap(); rec.hear("purple monkey dishwasher", true); break;
    case "nospeech": rec = await tap(); rec.fail("no-speech"); break;
    case "network": rec = await tap(); rec.fail("network"); break;
    case "answer":
      api.voice.stop();
      api.listen.listenForAnswer(SING, { question: "Which famous singer stood at the front gate to greet fans when the Del Mar racetrack opened in 1937?" });
      await sleep(80);
      FakeSR.last.hear("I think it's", false); keep(FakeSR.last, "I think it's");
      break;
    case "answered":
      api.voice.stop();
      api.listen.listenForAnswer(SING, { question: "Which famous singer stood at the front gate to greet fans when the Del Mar racetrack opened in 1937?" });
      await sleep(80);
      FakeSR.last.hear("Bing Crosby", true);
      break;
    case "help": api.listen.help(); break;
    case "reply": api.listen.run("where are we"); break;
    case "land": api.listen.run("what are those trees"); break;
    case "eta": api.listen.run("what time will we get to Redding"); break;
    case "past": api.listen.run("how far to Portland"); break;
    case "blocked": rec = await tap(); rec.fail("not-allowed"); break;
    default: break; // "drive": just the app with the mic in the header
  }
}

(async () => {
  let w;
  try {
    w = await loadApp();
    const api = w.I5BUDDY.api;
    w.SpeechRecognition = FakeSR;
    w.webkitSpeechRecognition = FakeSR;
    fakeVoice(w);
    api.settings.theme = THEME;
    api.saveSettings();
    w.document.documentElement.dataset.theme = THEME;
    api.setMode("gps");
    api.setPosition(M, { dir: DIR, speed: 64, jumped: true });
    await sleep(DELAY);
    if (AT) await sleep(Math.max(0, AT - performance.now()));
    if (STATE === "selftest") { await selftest(w, api); await moduleChecks(); }
    else {
      // Headless only advances CSS animations when it draws a frame, so a screenshot can catch the panel's fade-in
      // at opacity 0 (or a color change at its first frame). Skip the entrance animations here (the pulsing rings stay).
      const noFade = w.document.createElement("style");
      noFade.textContent = ".lsn,.lsn-panel,.lsn-reply{animation:none!important}.lsn-core{transition:none!important}";
      w.document.head.append(noFade);
      await showState(w, api, STATE);
    }
    if (Q.has("debug")) {
      await sleep(1500);
      const d = w.document, o = d.querySelector(".lsn"), p = d.querySelector(".lsn-panel");
      const r = p && p.getBoundingClientRect();
      const hit = r && d.elementFromPoint(r.left + r.width / 2, r.top + 60);
      console.log("LISTEN TEST debug " + JSON.stringify({
        hidden: o && o.hidden, cls: o && o.className, opOv: o && w.getComputedStyle(o).opacity, opPanel: p && w.getComputedStyle(p).opacity,
        anims: o ? o.getAnimations({ subtree: true }).map(a => `${a.animationName || a.transitionProperty}:${a.playState}:${Math.round(a.currentTime)}`) : [],
        hit: hit && (hit.className || hit.tagName), vis: d.visibilityState, rect: r && [Math.round(r.top), Math.round(r.height)],
      }));
    }
  } catch (e) {
    count("e2e", false, "setup: " + (e && e.message || e));
    document.getElementById("e2eBox").hidden = false;
    addRow("tE2E", false, ["setup", String(e && e.stack || e)]);
  }
  const tot = Object.values(tally).reduce((a, [p, n]) => [a[0] + p, a[1] + n], [0, 0]);
  const line = `${tot[0] === tot[1] ? "ALL PASS" : `FAILED ${tot[1] - tot[0]}`} · commands ${tally.cmd[0]}/${tally.cmd[1]} · alternatives ${tally.alt[0]}/${tally.alt[1]} · answers ${tally.ans[0]}/${tally.ans[1]}` +
    (tally.e2e[1] ? ` · app checks ${tally.e2e[0]}/${tally.e2e[1]}` : "");
  document.getElementById("sum").textContent = line;
  document.getElementById("info").textContent = `state=${STATE} theme=${THEME} mile=${M} ${DIR}`;
  const badge = document.getElementById("badge");
  badge.textContent = `LISTEN TESTS ${line} · showing: ${STATE}, ${THEME}`;
  badge.className = tot[0] === tot[1] ? "pass" : "fail";
  document.title = line;
  console.log("LISTEN TEST SUMMARY " + line);
})();
