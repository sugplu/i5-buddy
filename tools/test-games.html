<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>window.__BUDDY_SILENT__ = true; // silent tests: the app under test is never heard (js/voice.js)</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games tests</title>
<!--
  Tests for the Play tab's picker and the games in js/games/ (Plate Hunt, Higher or Lower, Where Is This, Would You Rather,
  Scavenger Hunt, Alphabet Game, Cow Count, Car Party, speed trivia, the passengers note, api.play.phrases()).
  The app runs in an iframe with ?silent=1; nothing is ever heard: speech is recorded by wrapping api.voice.say.
  URL params:
    s      check (default)   logic and flows for everything, then ALL PASS
           layout            every screen at the given width in the given theme: no horizontal overflow, touch targets
           shot              leave one screen up for a screenshot (game=<name>)
    theme  dark (default) | light
    width  iframe width in px (default 430; 360 for layout; 390 for shot)
    game   for s=shot: home, party, trivia, speed, plates, plates-list, higher, higher-reveal, where, where-reveal, wyr,
           wyr-split, hunt, alpha, cows, passenger
  Results go to the console as "GAMESTEST ..." lines.
-->
<style>
  html,body{margin:0;background:#2a2a2a;color:#ddd;font:12px/1.4 ui-monospace,Menlo,monospace}
  iframe{display:block;border:0;background:#000}
  #log{white-space:pre-wrap;padding:8px;margin:0}
  body.shot #log{display:none}
</style>
</head>
<body>
<iframe id="f" title="I-5 Buddy"></iframe>
<pre id="log"></pre>
<script src="../data/i5.js"></script>
<script>
const P = new URLSearchParams(location.search);
const SCEN = P.get("s") || "check";
const THEME = P.get("theme") === "light" ? "light" : "dark";
const WIDTH = +P.get("width") || (SCEN === "shot" ? 390 : SCEN === "layout" ? 360 : 430);
const HEIGHT = +P.get("height") || (SCEN === "shot" ? 844 : 932);
if (SCEN === "shot") document.body.classList.add("shot");
const logEl = document.getElementById("log");
function log(...a) { const s = a.join(" "); logEl.textContent += s + "\n"; console.log("GAMESTEST " + s); }
const f = document.getElementById("f");
f.style.width = WIDTH + "px"; f.style.height = HEIGHT + "px";

function seed() {
  try { localStorage.clear(); } catch (e) {}
  localStorage.setItem("i5b:settings", JSON.stringify({ theme: THEME, kid: false, narr: true, chime: true }));
}
seed();
const sleep = ms => new Promise(r => setTimeout(r, ms));
let loads = 0, navId = 0;
function hookServiceWorker() {
  let n = 0;
  const tick = () => {
    try {
      const w = f.contentWindow;
      if (w && /index\.html/.test(w.location.href) && !w.__i5test) { w.__i5test = true; if (w.navigator.serviceWorker) w.navigator.serviceWorker.register = () => new Promise(() => {}); return; }
    } catch (e) {}
    if (n++ < 5000) setTimeout(tick, 1);
  };
  tick();
}
f.addEventListener("load", () => {
  loads++;
  try {
    const w = f.contentWindow;
    w.addEventListener("error", e => log("ERROR (window)", e.message, e.filename + ":" + e.lineno));
    w.addEventListener("unhandledrejection", e => log("ERROR (promise)", String(e.reason && (e.reason.stack || e.reason))));
  } catch (e) {}
});
function navigate(reseed) {
  const id = ++navId;
  const go = () => { if (id !== navId) return; if (reseed) seed(); hookServiceWorker(); f.src = "../index.html?silent=1&nav=" + id; };
  if (!reseed) return go();
  const onBlank = () => { f.removeEventListener("load", onBlank); setTimeout(go, 50); };
  f.addEventListener("load", onBlank);
  f.src = "about:blank";
}
async function ready() {
  let tries = 0, since = performance.now(), seen = 0;
  for (let i = 0; i < 1600; i++) {
    const w = f.contentWindow;
    let cur = false;
    try { cur = new URLSearchParams(w.location.search).get("nav") === String(navId); } catch (e) {}
    if (cur && loads && w.I5BUDDY && w.I5BUDDY.api && w.I5BUDDY.api.play && w.I5BUDDY.api.play.phrases) { await sleep(60); return w.I5BUDDY.api; }
    if (loads > seen) { seen = loads; since = performance.now(); }
    if (cur && w.document.readyState === "complete" && !(w.I5BUDDY && w.I5BUDDY.api && w.I5BUDDY.api.play) && performance.now() - since > 2500 && tries < 3) { tries++; since = Infinity; log("note: the app did not boot; loading it again"); navigate(true); }
    await sleep(25);
  }
  throw new Error("app or play module did not load");
}

let W, D, api, spoken = [], allSpoken = [];
const $ = s => [...D.querySelectorAll(s)].find(e => !e.hidden && !e.closest("[hidden]")) || D.querySelector(s);   // the first one on screen
const $$ = s => [...D.querySelectorAll(s)];
const visible = el => !!el && !el.hidden && !el.closest("[hidden]");
async function open(id) { api.ui.go("play"); const r = await api.play.open(id); await sleep(30); return r; }
const click = sel => { const b = typeof sel === "string" ? $(sel) : sel; if (!b) throw new Error("no element " + sel); b.click(); return b; };
const ctrl = id => api.play.game(id);
const typeIn = (el, v) => { el.value = v; el.dispatchEvent(new W.Event("input", { bubbles: true })); };
function wrapVoice() {
  const real = api.voice.say.bind(api.voice);
  api.voice.say = (text, opts) => { spoken.push(String(text)); if (opts && /^play:/.test(opts.id || "")) allSpoken.push(String(text)); return real(text, opts); };   // allSpoken: only what the games said (their ids start with play:)
}
const tooNew = s => { for (const ch of s) { const c = ch.codePointAt(0); if ((c >= 0x1FA70 && c <= 0x1FAFF) || (c >= 0x1F7E0 && c <= 0x1F7EB) || c === 0x1F6FB || (c >= 0x1F9A2 && c <= 0x1F9AF) || (c >= 0x1F9C1 && c <= 0x1F9CF) || (c >= 0x1F9F0 && c <= 0x1F9FF) || (c >= 0x1F94D && c <= 0x1F94F) || (c >= 0x1F96C && c <= 0x1F970) || (c >= 0x1F973 && c <= 0x1F97F) || (c >= 0x1F998 && c <= 0x1F9A1)) return true; } return false; };

/* ---------- touch targets and overflow: every control on the Play tab that is on screen ---------- */
const TARGET_OK = ".pl-tile, figcaption a, .pl-sr, .pl-win, a";   // the tile map is the one dense grid (see the report); credit links are links
function smallTargets() {
  const bad = [];
  for (const b of $$("#view-play button, #view-play input, #view-play summary")) {
    if (!visible(b) || b.disabled || b.matches(TARGET_OK)) continue;
    const r = b.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) continue;
    if (r.height < 43.5 || r.width < 43.5) bad.push(`${b.className || b.tagName}${b.dataset.g ? "[" + b.dataset.g + "]" : ""} ${Math.round(r.width)}x${Math.round(r.height)} "${(b.textContent || b.getAttribute("aria-label") || "").trim().slice(0, 18)}"`);
  }
  return bad;
}
function overflow() {
  const o = D.documentElement.scrollWidth - D.documentElement.clientWidth;
  const vw = D.documentElement.clientWidth, out = [];
  for (const e of $$("#view-play *")) {
    if (!visible(e) || e.closest(".pl-confetti") || e.matches(".pl-sr")) continue;
    const r = e.getBoundingClientRect();
    if (r.width && (r.right > vw + 1 || r.left < -1)) out.push(`${e.className || e.tagName} ${Math.round(r.left)}..${Math.round(r.right)}`);
  }
  return o > 0 || out.length ? `overflow ${o}px at ${W.innerWidth}: ${out.slice(0, 3).join(" | ")}` : "";
}

/* ---------- logic checks ---------- */
async function check() {
  let pass = 0, fail = 0;
  const ok = (cond, name, extra = "") => { cond ? pass++ : fail++; log(cond ? "PASS" : "FAIL", name, extra); };
  const section = async (name, fn) => { try { await fn(); } catch (e) { fail++; log("FAIL", name, "threw", e && (e.stack || e.message || e)); } };
  const store = k => { try { return JSON.parse(W.localStorage.getItem("i5b:" + k)); } catch (e) { return null; } };
  const PL = api.data.PLACES;
  const party = () => api.play.party();

  await section("picker", async () => {
    api.ui.go("play");
    await sleep(40);
    const cards = $$("#pl-home .pl-gcard");
    const ids = cards.map(c => c.dataset.g);
    ok(ids.length === 10 && new Set(ids).size === 10, "the picker shows 10 game cards", ids.join(","));
    ok(["bingo", "trivia", "spy", "plates", "higher", "where", "wyr", "hunt", "alpha", "cows"].every(i => ids.includes(i)), "all the games are there");
    ok(visible($("#pl-home")) && !visible($("#pl-bingo")) && api.play.screen() === "home", "Play opens on the picker");
    ok(cards.every(c => c.getBoundingClientRect().height >= 100 && c.querySelector(".pl-gcard-ic") && c.querySelector("b") && c.querySelector("small")), "each card has an icon, a name and a line, and is big");
    ok(!$(".pl-gcard.last"), "no 'last played' card before any game was opened");
    ok(!!$(".pl-partybar"), "the Car Party bar is on the picker");
    const emoji = cards.map(c => c.querySelector(".pl-gcard-ic").textContent).concat([$(".pl-partybar-ic").textContent]);
    ok(!emoji.some(tooNew), "card emoji are Unicode 9 or older", emoji.filter(tooNew).join(" "));
    click('#pl-home [data-g="bingo"]');
    await sleep(30);
    ok(api.play.screen() === "bingo" && visible($("#pl-bingo")) && !visible($("#pl-home")), "tapping a card opens the game");
    ok(store("playGame") === "bingo", "the last game is saved", String(store("playGame")));
    ok(!!$("#pl-bingo .pl-grid button[data-i]"), "road bingo still draws its card");
    $("#pl-bingo .pl-grid button[data-i]").click();
    ok(store("bingo").on.filter(Boolean).length === 2, "bingo still saves its marks");
    click("#pl-bingo .pl-back");
    await sleep(30);
    ok(api.play.screen() === "home" && !!$('.pl-gcard.last[data-g="bingo"]'), "back returns to the picker with Bingo marked as last played");
    ok(/Last played/.test($('.pl-gcard.last[data-g="bingo"]').getAttribute("aria-label")), "a screen reader hears 'last played'");
    ok(await api.play.open("chess") === false, "an unknown game is refused");
    click('#pl-home [data-g="trivia"]');
    ok(!!$("#pl-trivia .pl-opt") && store("playGame") === "trivia", "trivia opens from the picker");
    click("#pl-trivia .pl-back");
    click('#pl-home [data-g="spy"]');
    ok(!!$("#pl-spy .pl-quick"), "I spy opens from the picker");
    ok(api.play.games().length === 10, "api.play.games() lists the games");
    await api.play.open("home");
  });

  await section("passengers note", async () => {
    await open("home");
    const note = $(".pl-pass");
    ok(!!note && !visible(note), "no passengers note while parked");
    api.S.mode = "manual"; api.S.speed = 70; api.bus.emit("pos", { m: 300, dir: "N", speed: 70 });
    ok(!visible(note), "no note in manual mode, even with a speed");
    api.S.mode = "gps"; api.S.speed = 65; api.bus.emit("pos", { m: 300, dir: "N", speed: 65 });
    ok(visible(note) && /For passengers/.test(note.textContent), "the note shows in GPS mode over 10 mph", note.textContent);
    ok(!$("#pl-home .pl-gcard").disabled && getComputedStyle(note).position !== "fixed" && !/!/.test(note.textContent), "calm: play is not blocked, the note is in the flow, no exclamation mark");
    api.S.speed = 6; api.bus.emit("pos", { m: 300, dir: "N", speed: 6 });
    ok(!visible(note), "the note goes away under 10 mph");
    api.S.mode = "demo"; api.S.speed = 60; api.bus.emit("pos", { m: 301, dir: "N", speed: 60 });
    ok(visible(note), "and shows in a demo drive");
    api.S.mode = "off"; api.S.speed = null; api.bus.emit("mode", "off");
    ok(!visible(note), "and goes when tracking stops");
  });

  await section("car party", async () => {
    await open("party");
    const P = party();
    ok(api.play.screen() === "party" && !!$(".pl-party"), "Car Party opens from the API");
    ok(!P.active(), "off at first");
    click('.pl-party [data-k="start"]');
    ok(P.active() && P.players().length === 2, "Start makes 2 players", JSON.stringify(P.state()));
    click('.pl-party [data-k="plus"]'); click('.pl-party [data-k="plus"]');
    ok(P.players().length === 4, "the stepper adds players");
    for (let i = 0; i < 5; i++) { const b = $('.pl-party [data-k="plus"]'); if (!b.disabled) b.click(); }
    ok(P.players().length === 6 && $('.pl-party [data-k="plus"]').disabled, "6 is the most");
    for (let i = 0; i < 6; i++) { const b = $('.pl-party [data-k="minus"]'); if (!b.disabled) b.click(); }
    ok(P.players().length === 2 && $('.pl-party [data-k="minus"]').disabled, "2 is the fewest");
    click('.pl-party [data-k="plus"]');
    typeIn($('.pl-party [data-k="name0"]'), "Maya");
    ok(P.players()[0].n === "Maya", "names can be typed");
    const c0 = P.players()[0].c;
    click('.pl-party [data-k="color0"]');
    ok(P.players()[0].c !== c0 && new Set(P.players().map(p => p.c)).size === 3, "tapping a color gives the next free one");
    ok(store("party").players[0].n === "Maya" && store("party").on === true, "the party is saved");
    P.award(2, 0); P.award(1, 1);
    ok(P.standings()[0].n === "Maya" && P.leaders().length === 1, "scores add up", JSON.stringify(P.standings().map(p => p.n + p.s)));
    ok(P.current().i === 0, "turn starts with the first player");
    P.advance(); ok(P.current().i === 1, "and passes on");
    click('.pl-party [data-k="reset"]');
    ok(!$(".pl-party .pl-confirm").hidden, "reset asks first");
    click('.pl-party [data-k="keep"]');
    ok(P.players()[0].s === 2, "keeping leaves the scores");
    click('.pl-party [data-k="reset"]'); click('.pl-party [data-k="reset-yes"]');
    ok(P.players().every(p => p.s === 0), "reset clears them");
    ok(smallTargets().length === 0, "party setup: touch targets", smallTargets().join(" | "));
    await open("home");
    ok($$(".pl-partybar .pl-pchip").length === 3, "the picker shows the players' chips", String($$(".pl-partybar .pl-pchip").length));
    P.stop();
  });

  await section("speed trivia", async () => {
    await open("trivia");
    click('#pl-trivia [data-tm="speed"]');
    await sleep(200);
    ok(visible($("#pl-trivia .pl-speed")) && !visible($("#pl-trivia .pl-q")), "the speed round replaces the question box");
    ok(!!$('.pl-speed [data-k="start"]'), "it starts with a Start button");
    const classicBefore = JSON.stringify(store("trivia"));
    click('.pl-speed [data-k="start"]');
    await sleep(60);
    ok(!!$(".pl-sp-clock") && $$(".pl-speed .pl-opt").length === 4, "a question, 4 answers and a clock");
    ok(/Question 1 of 10/.test($(".pl-sp-q").textContent), "Question 1 of 10", $(".pl-sp-q").textContent);
    const pool = api.data.TRIVIA, texts = [];
    let rightN = 0;
    for (let i = 0; i < 10; i++) {
      const q = pool.find(t => t.q === $(".pl-speed .pl-qt").textContent);
      texts.push(q && q.q);
      if (i === 4) {   // run the clock out on one question
        await sleep(15600);
        ok(/Time is up/.test($(".pl-speed").textContent) && $$(".pl-speed .pl-opt.right").length === 1 && $$(".pl-speed .pl-opt:disabled").length === 4, "time runs out: the answer shows, nothing more to tap");
        await sleep(1900);
        continue;
      }
      const wrong = i % 3 === 0, idx = wrong ? (q.answer + 1) % 4 : q.answer;
      if (!wrong) rightN++;
      $$(".pl-speed .pl-opt")[idx].click();
      if (i === 0) ok(!!$(".pl-speed .pl-opt.right") && !!$(".pl-speed .pl-opt.wrong"), "an answer marks the right choice and a wrong pick");
      await sleep(wrong ? 1950 : 1250);
    }
    ok(texts.every(t => !!t) && new Set(texts).size === 10, "10 different questions from the trivia pool");
    await sleep(100);
    ok(!!$(".pl-sp-big") && new RegExp(`^${rightN} of 10$`).test($(".pl-sp-big").textContent), `a score at the end that matches the right answers (${rightN})`, $(".pl-speed").textContent.slice(0, 80));
    ok(store("triviaSpeed").best === rightN && store("triviaSpeed").rounds === 1, "speed best and rounds are saved", JSON.stringify(store("triviaSpeed")));
    ok(JSON.stringify(store("trivia")) === classicBefore, "the classic trivia score is untouched");
    ok(smallTargets().length === 0, "speed trivia: touch targets", smallTargets().join(" | "));
    click('.pl-speed [data-k="again"]');
    await sleep(40);
    ok(/Question 1 of 10/.test($(".pl-sp-q").textContent), "Play again starts a new round");
    click('#pl-trivia [data-tm="classic"]');
    await sleep(40);
    ok(visible($("#pl-trivia .pl-q")) && !visible($("#pl-trivia .pl-speed")), "Classic brings the question box back");
  });

  await section("plate hunt", async () => {
    await open("plates");
    const tiles = () => $$(".pl-tile");
    ok(!!ctrl("plates") && tiles().length === 51, "a tile map with 51 states and D.C.", String(tiles().length));
    const sq = {};
    for (const t of tiles()) sq[t.dataset.c] = t.getBoundingClientRect();
    ok(new Set(tiles().map(t => Math.round(t.getBoundingClientRect().width))).size === 1 && Math.abs(sq.CA.width - sq.CA.height) < 1, "the tiles are equal squares");
    ok(sq.WA.top < sq.CA.top && sq.CA.top < sq.AZ.top && sq.CA.left < sq.NV.left && sq.NV.left < sq.WY.left, "laid out like the well-known tile map (west left, north up)");
    ok($(".pl-pl-n").textContent === "0 of 51", "0 of 51 to start", $(".pl-pl-n").textContent);
    click('.pl-tile[data-c="CA"]');
    ok($('.pl-tile[data-c="CA"]').getAttribute("aria-pressed") === "true" && /found/.test($('.pl-tile[data-c="CA"]').getAttribute("aria-label")), "tapping a state marks it found, with a label");
    ok($(".pl-pl-n").textContent === "1 of 51", "progress counts it");
    const pl = store("plates");
    ok(Array.isArray(pl.found.CA) && typeof pl.found.CA[0] === "number" && /Found \S+/.test($(".pl-pl-read").textContent), "the date is saved and shown", $(".pl-pl-read").textContent);
    click('.pl-tile[data-c="CA"]');
    ok(store("plates").found.CA === undefined && $(".pl-pl-n").textContent === "0 of 51", "tapping again takes it off");
    click('.pl-pl-read [data-k="undo"]');
    ok(Array.isArray(store("plates").found.CA), "Undo puts it back");
    click('.pl-tile[data-c="CA"]');
    spoken.length = 0;
    click('.pl-tile[data-c="HI"]');
    ok(visible($(".pl-rare")) && /Hawaii/.test($(".pl-rare").textContent), "Hawaii is a rare find", $(".pl-rare").textContent);
    await sleep(60);
    ok(spoken.includes("Hawaii. That is a rare find."), "and says so (narration on)", spoken.join("|"));
    click('.pl-tile[data-c="AK"]');
    ok(/Alaska/.test($(".pl-rare").textContent), "Alaska too");
    click('.pl-tile[data-c="NV"]');
    ok(!visible($(".pl-rare")) && $('.pl-tile[data-c="HI"]').classList.contains("rare"), "an ordinary state clears the callout; rare tiles are marked");
    $(".pl-bonus").open = true;
    click('.pl-chip2[data-c="CAN-BC"]'); click('.pl-chip2[data-c="MX-JAL"]');
    ok(/2 of 45/.test($(".pl-bonus-n").textContent) && $(".pl-pl-n").textContent === "3 of 51", "bonus plates count apart from the 51", $(".pl-bonus-n").textContent);
    ok($$(".pl-chips")[0].children.length === 13 && $$(".pl-chips")[1].children.length === 32, "Canada has 13, Mexico 32");
    click('[data-view="list"]');
    ok(visible($(".pl-listview")) && !visible($(".pl-mapview")) && $$(".pl-lrow").length === 96, "the list view has every plate", String($$(".pl-lrow").length));
    const search = $(".pl-search");
    typeIn(search, "ore");
    ok($$(".pl-lrow").some(r => /Oregon/.test(r.textContent)) && $$(".pl-lrow").length < 12, "search narrows it", String($$(".pl-lrow").length));
    typeIn(search, "zzz");
    ok($$(".pl-lrow").length === 0 && /No plate matches/.test($(".pl-plist").textContent), "no match says so");
    typeIn(search, "");
    click('.pl-lrow[data-c="OR"]');
    ok(store("plates").found.OR && $('.pl-lrow[data-c="OR"]').getAttribute("aria-pressed") === "true", "a list row marks a plate too");
    click('[data-f="found"]');
    ok($$(".pl-lrow").length === 6 && $$(".pl-lrow").every(r => r.getAttribute("aria-pressed") === "true"), "the Found filter lists only what is found", String($$(".pl-lrow").length));
    click('[data-f="all"]');
    click('[data-scope="trip"]');
    ok($(".pl-pl-n").textContent === "4 of 51", "'this trip' counts what was found since the trip began", $(".pl-pl-n").textContent);
    api.bus.emit("trip:end", {});
    await sleep(20);
    ok($(".pl-pl-n").textContent === "0 of 51" && store("plates").found.OR.length === 1, "a trip ending starts 'this trip' from zero and keeps all time");
    click('[data-scope="all"]');
    ok($(".pl-pl-n").textContent === "4 of 51", "all time still has them", $(".pl-pl-n").textContent);
    click('[data-view="grid"]');
    click('.pl-pl-foot [data-k="reset"]');
    ok(!$("#pl-plates .pl-confirm").hidden, "reset asks first");
    click('#pl-plates .pl-confirm [data-k="keep"]');
    ok(Object.keys(store("plates").found).length > 0, "keeping leaves the plates");
    click('.pl-pl-foot [data-k="reset"]'); click('#pl-plates [data-k="reset-yes"]');
    ok(Object.keys(store("plates").found).length === 0 && $(".pl-pl-n").textContent === "0 of 51", "reset clears everything");
    ok(smallTargets().length === 0, "plate hunt: touch targets (map tiles aside)", smallTargets().join(" | "));
    for (const t of tiles()) t.click();
    await sleep(40);
    ok($(".pl-pl-n").textContent === "51 of 51" && !!$(".pl-win") && /ALL 51/.test($(".pl-win-t").textContent), "all 51 earns a celebration", $(".pl-win-t") && $(".pl-win-t").textContent);
    $(".pl-win") && $(".pl-win").click();
    typeIn(search, "");
  });

  await section("higher or lower", async () => {
    await open("higher");
    const C = ctrl("higher");
    let s = C.state();
    ok(!!C && s.phase === "ask" && s.cats.length === 4, "all four kinds of question are available", s.cats.join(","));
    const placeBy = id => PL.find(p => p.id === id), DS = api.data.DESTS, MS = api.data.MISSIONS;
    const wrongNumber = st => {   // every number must come from the app's data
      for (const it of [st.known, st.hidden]) {
        if (it.cat === "elev") { const p = placeBy(it.id); if (!p || api.data.elevAt(p.m) !== it.v) return `elev ${it.id}`; }
        else if (it.cat === "north") { const p = placeBy(it.id); if (!p || Math.round(p.m) !== it.v) return `north ${it.id}`; }
        else if (it.cat === "dist") { const [a, b] = it.pair.map(n => DS.find(d => d.name === n)); if (!a || !b || Math.round(Math.abs(b.m - a.m)) !== it.v) return `dist ${it.id}`; }
        else { const mi = MS.find(x => x.name === it.name); if (!mi || parseInt(mi.founded, 10) !== it.v) return `mission ${it.id}`; }
      }
      return "";
    };

  let pass = 0, fail = 0;
  const ok = (c, n, x = "") => { c ? pass++ : fail++; log(c ? "PASS" : "FAIL", n, x); };
  const screens = [["home"], ["party"], ["bingo"], ["trivia"], ["spy"], ["plates"], ["plates", "list"], ["higher"], ["where"], ["where", "play"], ["wyr"], ["hunt"], ["alpha"], ["alpha", "play"], ["cows"]];
  api.play.party().start(3);
  for (const [id, step] of screens) {
    await open(id);
    try {
      if (id === "where" && step) { click('#pl-where [data-k="start"]'); await sleep(40); }
      if (id === "alpha" && step) { click('#pl-alpha [data-k="start"]'); await sleep(30); }
      if (id === "plates" && step) { click('[data-view="list"]'); await sleep(20); }
    } catch (e) { log("note", id, e.message); }
    await sleep(60);
    const tag = `${id}${step ? " " + step : ""} ${WIDTH}px ${THEME}`;
    const o = overflow(), t = smallTargets();
    ok(!o, `${tag}: no horizontal overflow`, o);
    ok(!t.length, `${tag}: touch targets 44 px or more`, t.slice(0, 3).join(" | "));
  }
  // the answered / revealed states are the tallest and widest
  await open("higher"); { const C = ctrl("higher"); click(`.pl-hbtn.${C.state().correct}`); await sleep(900); const o = overflow(); ok(!o, `higher answered ${WIDTH}px ${THEME}: no overflow`, o); }
  await open("where"); { if (ctrl("where").state().phase !== "ask") { click('#pl-where [data-k="start"]'); await sleep(30); } click('#pl-where .pl-opt[data-i="0"]'); await sleep(60); const o = overflow(); ok(!o, `where answered ${WIDTH}px ${THEME}: no overflow`, o); }
  await open("wyr"); { click('.pl-wyr-opt[data-s="a"]'); click('.pl-wyr-opt[data-s="b"]'); click('.pl-wyr-opt[data-s="b"]'); if ($('[data-k="show"]')) click('[data-k="show"]'); await sleep(900); const o = overflow(); ok(!o, `wyr split ${WIDTH}px ${THEME}: no overflow`, o); }
  await open("trivia"); { click('#pl-trivia [data-tm="speed"]'); await sleep(200); click('.pl-speed [data-k="start"]'); await sleep(60); const o = overflow(); ok(!o, `speed trivia ${WIDTH}px ${THEME}: no overflow`, o); }
  const th = D.documentElement.dataset.theme;
  ok(th === THEME, `theme is ${THEME}`, th);
  log(fail ? "FAILED" : "ALL PASS", `(${pass}${fail ? ", " + fail + " failed" : ""})`);
}

/* ---------- one screen for a screenshot ---------- */
async function shot() {
  const g = P.get("game") || "home";
  const party = api.play.party();
  if (["home", "party", "higher", "higher-reveal", "where", "where-reveal", "wyr", "wyr-split"].includes(g)) {
    party.setPlayers(3); party.start(3);
    await open("party");
    ["Maya", "Leo", "Sam"].forEach((n, i) => typeIn($(`.pl-party [data-k="name${i}"]`), n));
    party.award(3, 0); party.award(2, 1); party.award(1, 2); party.setTurn(1);
  }
  api.S.m = 300; api.S.dir = "N";
  if (g === "home") { await open("bingo"); click("#pl-bingo .pl-back"); }
  else if (g === "party") { await open("party"); }
  else if (g === "passenger") { api.S.mode = "gps"; api.S.speed = 66; api.bus.emit("pos", { m: 300, dir: "N", speed: 66 }); await open("home"); }
  else if (g === "speed") { await open("trivia"); click('#pl-trivia [data-tm="speed"]'); await sleep(200); click('.pl-speed [data-k="start"]'); await sleep(2000); }
  else if (g === "plates" || g === "plates-list") {
    await open("plates");
    for (const c of ["CA", "OR", "WA", "NV", "AZ", "TX", "NY", "FL", "CO", "UT", "ID", "MT", "IL", "HI"]) click(`.pl-tile[data-c="${c}"]`);
    if (g === "plates-list") { click('[data-view="list"]'); }
    await sleep(700);
  }
  else if (g === "higher" || g === "higher-reveal") { await open("higher"); if (g === "higher-reveal") { const C = ctrl("higher"); click(`.pl-hbtn.${C.state().correct}`); await sleep(1000); } }
  else if (g === "where" || g === "where-reveal") { await open("where"); click('#pl-where [data-k="start"]'); await sleep(200); if (g === "where-reveal") { click(`#pl-where .pl-opt[data-i="${ctrl("where").state().q.answer}"]`); await sleep(100); } }
  else if (g === "wyr" || g === "wyr-split") { await open("wyr"); if (g === "wyr-split") { for (const s of ["a", "b", "a"]) click(`.pl-wyr-opt[data-s="${s}"]`); await sleep(1000); } }
  else if (g === "hunt") { await open("hunt"); const C = ctrl("hunt"); for (const id of C.state().ids.slice(0, 6)) click(`.pl-hitem[data-id="${id}"]`); await sleep(500); }
  else if (g === "alpha") { await open("alpha"); click('#pl-alpha [data-k="start"]'); for (let i = 0; i < 16; i++) click('[data-k="found"]'); await sleep(500); }
  else if (g === "cows") { await open("cows"); for (const k of ["l", "l", "l", "r", "r", "l"]) click(`[data-k="cow-${k}"]`); click('[data-k="grave-r"]'); await sleep(300); }
  else { await open(g); }
  await sleep(300);
  log("DONE", g, THEME, WIDTH);
}

(async function main() {
  navigate();
  try {
    api = await ready();
    W = f.contentWindow; D = W.document;
    wrapVoice();
    D.documentElement.dataset.theme = THEME;
    api.settings.theme = THEME;
    if (SCEN === "layout") await layout();
    else if (SCEN === "shot") await shot();
    else await check();
  } catch (e) { log("FAIL", "ERROR", String(e && (e.message || e)).replace(/\s+/g, " "), String(e && e.stack || "").split("\n").slice(1, 3).join(" ").replace(/\s+/g, " ")); log("FAILED"); }
})();
</script>
