<!doctype html>
<meta charset="utf-8">
<script>window.__BUDDY_SILENT__ = true; // silent tests: the app under test is never heard (js/voice.js)</script>
<title>I-5 Buddy road-test findings</title>
<style>body{font:13px/1.4 ui-monospace,Menlo,monospace;margin:12px}iframe{width:430px;height:900px;border:1px solid #888;float:right}.pass{color:#090}.fail{color:#c00;font-weight:bold}.skip{color:#888}</style>
<iframe id="f" src="../index.html?silent=1"></iframe>
<pre id="out">running…</pre>
<script>
// Findings of the 2026-11-20 road tests (Claude read four full simulated drives, tools/transcript.html, and each finding was
// reproduced here before anything was fixed). A check that holds is a normal PASS. A check for a bug that is still in the app is
// filed as `bug(id, cond, message)`: while it fails it prints KNOWN BUG and does not fail the suite; the day the app is fixed it
// prints "now passes, switch it to ok()". Nothing here changes the app. All silent.
// 3.0.7: all seven filed bugs (1-miles, rest-name-water, eta-abbrev, summit-stale, chunk-decimal, chunk-abbrev, mission-dup-exit)
// are fixed and are ok() checks now, so the suite fails if one comes back; each fix has extra checks next to it.
const out = document.getElementById("out"), lines = [];
let fails = 0, known = 0;
const ok = (c, m) => { lines.push(`${c ? "PASS" : "FAIL"} ${m}`); if (!c) fails++; };
const bug = (id, c, m) => { if (c) lines.push(`PASS (fixed? switch to ok) [${id}] ${m}`); else { known++; lines.push(`KNOWN BUG [${id}] ${m}`); } };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  const win = document.getElementById("f").contentWindow;
  for (let i = 0; i < 100 && !win.I5BUDDY; i++) await sleep(100);
  const api = win.I5BUDDY.api;
  await sleep(800);
  const { PLACES, ROUTE } = api.data;
  api.settings.narr = true; api.settings.chime = false; api.settings.live = false;
  const said = [];
  const realSay = api.voice.say;
  const spy = () => { said.length = 0; api.voice.say = (text, o = {}) => { said.push({ text, o }); return Promise.resolve(true); }; };
  const unspy = () => { api.voice.say = realSay; };

  // R1. Which side of I-5 a place is on matches where the place is: 197 landmarks more than 0.2 miles from the road.
  //     (Claude suspected wrong sides at Midway Substation and the Agua Hedionda desalination plant; the data agrees with the
  //     coordinates, so those lines are about the record's own point, not a bug in the app.)
  {
    const sideOf = (lat, lon) => {
      let best = null;
      for (let i = 0; i < ROUTE.length - 1; i++) {
        const [m0, a0, o0] = ROUTE[i], [m1, a1, o1] = ROUTE[i + 1];
        const kx = 69.17 * Math.cos(lat * Math.PI / 180);
        const ax = (o0 - lon) * kx, ay = (a0 - lat) * 69, dx = (o1 - o0) * kx, dy = (a1 - a0) * 69;
        const L = dx * dx + dy * dy || 1e-12, t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L));
        const px = ax + t * dx, py = ay + t * dy, dist = Math.hypot(px, py);
        if (!best || dist < best.dist) best = { dist, side: dx * -py - dy * -px < 0 ? 1 : -1 };
      }
      return best;
    };
    let n = 0; const wrong = [];
    for (const p of PLACES) {
      if (p.lat == null || !p.side || p.detour) continue;
      const s = sideOf(p.lat, p.lon);
      if (s.dist < 0.2) continue;
      n++;
      if (s.side !== p.side) wrong.push(p.id);
    }
    ok(n > 150 && !wrong.length, `the left/right side of ${n} landmarks matches their coordinates (${wrong.length ? "wrong: " + wrong.slice(0, 5).join(", ") : "none wrong"})`);
  }

  // R2. "Next gas: Exit 120, in about 1 miles" (S-default and N drives, mile 120.3, 76.7): never "1 miles"; an exit already behind
  //     the car is not "ahead".
  {
    spy();
    api.setMode("demo");
    api.setPosition(120.3, { dir: "N", speed: 65, jumped: true });
    api.narrator.tellServices("fuel");
    const t = (said.find(x => /Next gas/.test(x.text)) || { text: "" }).text;
    unspy();
    ok(!!t && !/\b1 miles\b/.test(t), `[1-miles] the next-gas answer never reads "1 miles" (${t.slice(0, 90)})`);
    spy();
    api.setPosition(120.15, { dir: "N", speed: 65, jumped: true });
    api.narrator.tellServices("fuel");
    const t2 = (said.find(x => /Next gas/.test(x.text)) || { text: "" }).text;
    unspy();
    ok(/^Next gas: Exit 120, just ahead: .+\. After that, Exit 121, in about a mile\.$/.test(t2), `[1-miles] an exit under half a mile ahead is "just ahead", one 0.85 miles ahead "in about a mile" (${t2})`);
    // the same words for a rest area about 1.2 miles ahead (Buttonwillow northbound, mile 259.19)
    spy();
    api.setPosition(258, { dir: "N", speed: 65, jumped: true });
    api.narrator.tellServices("rest");
    const r = (said.find(x => /rest area/i.test(x.text)) || { text: "" }).text;
    unspy();
    ok(/in about a mile\./.test(r) && !/\b[01] miles\b/.test(r), `[1-miles] a rest area 1.2 miles ahead is "in about a mile" (${r.slice(0, 90)})`);
    api.stopAll(false);
    // chain controls (js/live.js chainLine) 1.2 and 1.4 miles ahead
    const doc = win.document;
    if (!win.__liveMod) { const sc = doc.createElement("script"); sc.type = "module"; sc.textContent = "import * as m from './js/live.js'; window.__liveMod = m;"; doc.head.append(sc); }
    for (let i = 0; i < 40 && !win.__liveMod; i++) await sleep(100);
    const T = win.__liveMod && win.__liveMod._test;
    const cl = T && T.chainLine ? T.chainLine({ status: "R-1", place: "Lakehead", d: 1.2, level: 1 }, [{ status: "R-2", place: "Castella", d: 1.4 }]) : "";
    ok(/R 1 near Lakehead, in about a mile\. Then R 2 near Castella, in about a mile\./.test(cl) && !/\b1 miles\b/.test(cl), `[1-miles] chain controls about a mile ahead (${cl.slice(0, 110)})`);
  }

  // R3. A rest area with no real name is spoken as "the next rest area on this side is Water" (S-default, mile 256; the data
  //     has rest areas named Water, Rest area, and truck stops named TA and Services).
  {
    const junk = api.data.REST ? api.data.REST : null;
    spy();
    api.setMode("demo");
    api.setPosition(256.7, { dir: "S", speed: 65, jumped: true });
    api.narrator.tellServices("rest");
    const t = (said.find(x => /rest area/i.test(x.text)) || { text: "" }).text;
    unspy();
    ok(!!t && !/ is (Water|Rest area|TA|Services),/.test(t), `[rest-name-water] the next-rest-area answer names a real rest area (${t.slice(0, 100)})`);
    const nameless = (junk || []).filter(r => /^(water|rest area|services)$/i.test(String(r.name).trim()));
    ok(!!junk && !nameless.length, `[rest-name-water] the data has no rest stop without a real name (${nameless.map(r => r.name + " " + r.m).join(", ") || "none"})`);
    api.stopAll(false);
  }

  // R3b (3.0.7). A rest area Caltrans lists as closed (tools/rest-status.json -> REST[].status) is announced as closed, then
  //     the next open one on this side; the next-open count and the Drive row keep working.
  {
    const R = api.data.REST, dir = "N", at = 250;
    const first = api.data.restAhead(at, dir, 1)[0];
    const keep = first && { status: first.status, src: first.src };
    const row = first && R.find(r => r.name === first.name && r.m === first.m && r.side === first.side);
    const keepChecked = row && row.checked;
    if (row) { row.status = "closed"; row.src = "https://dot.ca.gov/test"; row.checked = new Date().toISOString().slice(0, 10); }
    const two = api.data.restAhead(at, dir, 1);
    ok(!!row && two.length === 2 && two[0].status === "closed" && two[1].status !== "closed", `restAhead keeps the closed one and still finds 1 open one (${two.map(r => r.name + (r.status ? " [" + r.status + "]" : "")).join(" | ")})`);
    spy();
    api.setMode("demo");
    api.setPosition(at, { dir, speed: 65, jumped: true });
    api.narrator.tellServices("rest");
    const t = (said.find(x => /rest area|closed/i.test(x.text)) || { text: "" }).text;
    unspy();
    ok(/is closed, Caltrans says\. The next rest area on this side is .+, in about \d+ miles\./.test(t) && two[1] && t.includes(two[1].name.replace(/\s*\((north|south)bound\)/i, "")), `a closed rest area is announced as closed, then the next open one ("${t.slice(0, 140)}")`);
    if (row) {
      if (keep.status) row.status = keep.status; else delete row.status; if (keep.src) row.src = keep.src; else delete row.src;
      if (keepChecked) row.checked = keepChecked; else delete row.checked;
    }
    const rs = api.data.restStatus, day = Date.parse("2026-11-20T12:00:00-08:00"), D1 = 864e5, c = "2026-11-20";
    ok(rs({ status: "closed", checked: c, until: "2026-11-23" }, day) === "closed" && rs({ status: "closed", checked: c, until: "2026-11-19" }, day) === "" && rs({}, day) === "",
      "a closure stops counting once Caltrans' reopening date has passed on the phone's clock");
    // nightly review 2026-11-20: a closure with no reopening date never ran out in the app; now it counts for
    // REST_STATUS_DAYS after Caltrans was read (build.py ships `checked`), like build.py's own rule
    ok(api.data.REST_STATUS_DAYS === 7 && rs({ status: "closed", checked: c }, day + 6 * D1) === "closed" && rs({ status: "closed", checked: c }, day + 8 * D1) === ""
      && rs({ status: "partial", checked: c, until: "2027-03-01" }, day + 10 * D1) === "" && rs({ status: "closed" }, day) === "" && rs({ status: "closed", checked: "soon" }, day) === "",
      "[review] a closure with no reopening date runs out 7 days after Caltrans was read, and one without that date is not trusted");
    const withStatus = api.data.REST.filter(r => r.status);
    ok(withStatus.every(r => /^\d{4}-\d\d-\d\d$/.test(r.checked || "")), `[review] every closure in the data carries the date Caltrans was read (${withStatus.map(r => r.name + " " + (r.checked || "NO DATE")).join(" | ") || "no closures today"})`);
    api.stopAll(false);
  }

  // R4. How-far answers say "9 h 30 min": a speech engine reads the h and min as letters or clips them.
  {
    spy();
    api.setMode("demo");
    api.S.dest = { name: "Oregon border", m: 797 };
    api.setPosition(180.3, { dir: "N", speed: 65, jumped: true });
    for (let i = 0; i < 40; i++) api.setPosition(180.3 + i * 0.02, { dir: "N", speed: 65 });
    api.narrator.howFar();
    const t = (said.find(x => /miles away/.test(x.text)) || { text: "" }).text;
    unspy();
    ok(!!t && !/\b\d+ h\b|\bmin\b/.test(t) && /around \d+ hours?( and \d+ minutes?)?,|around \d+ minutes?,/.test(t), `[eta-abbrev] how-far says the time in words (${t.slice(0, 100)})`);
    const W = api.data.fmtDurationSpoken;
    ok(W(9.5) === "9 hours and 30 minutes" && W(1) === "1 hour" && W(1 / 60) === "1 minute" && W(0.75) === "45 minutes" && W(1.995) === "2 hours" && W(2 + 1 / 60) === "2 hours and 1 minute" && W(0) === "",
      `[eta-abbrev] spoken durations: ${[9.5, 1, 1 / 60, 0.75, 1.995].map(W).join(" | ")}`);
    ok(/about \d+ miles away/.test(t) && !/\bthe the\b/i.test(t), `how-far names the destination once ("${t.slice(0, 60)}")`);
    api.S.dest = null;
    api.stopAll(false);
  }

  // R5. A "The road climbs ... over the next 12 miles" line waits behind a story with no check: it plays miles late (N-default:
  //     asked at mile 784.3, spoken at 788.3 with 8 miles of California left; S-default: 6 miles late at the Grapevine).
  {
    spy();
    api.stopAll(false);
    api.setMode("demo");
    api.setPosition(189, { dir: "N", speed: 65, jumped: true });
    api.setPosition(190.5, { dir: "N", speed: 65 });
    const s = said.find(x => /^summit:/.test(x.o.id || ""));
    unspy();
    ok(!!s, "the climb warning is asked for ahead of the Grapevine");
    ok(!!s && typeof s.o.check === "function" && typeof s.o.fresh === "function", "[summit-stale] the climb warning has a check and fresh text, so it can't play after the climb has been passed");
    if (s && s.o.check && s.o.fresh) {
      const top = Number(String(s.o.id).split(":")[1]);
      const now0 = s.o.check(), words0 = s.o.fresh();
      api.setPosition(top - 5, { dir: "N", speed: 65, jumped: true });
      const mid = s.o.check(), words1 = s.o.fresh();
      api.setPosition(top - 1, { dir: "N", speed: 65, jumped: true });
      const late = s.o.check();
      api.setPosition(top - 5, { dir: "S", speed: 65, jumped: true });
      const turned = s.o.check();
      ok(now0 && mid && !late && !turned && /over the next 5 miles/.test(words1 || "") && words0 !== words1,
        `[summit-stale] it is worded again from where the car is and dropped near the top or after turning around (${[now0, mid, late, turned].join(", ")}; "${(words1 || "").slice(0, 70)}")`);
    }
    api.stopAll(false);
  }

  // R6. The device-voice chunker (js/voice.js chunks()) cuts a number at its decimal point and a name at "Jr.": the engine then
  //     says "seven" and "two-mile" apart, or starts a chunk with ", who" (19 numbers and 4 names in one drive).
  {
    unspy();
    api.stopAll(false);
    win.__BUDDY_SPOKEN__ = [];
    const pad = "x ".repeat(105);                         // a first sentence right at the 220-character limit
    api.voice.say(pad + "The pipe is 7.2 miles long. Next.", { id: "chunk-test", now: true });
    await sleep(6000);
    const sp = (win.__BUDDY_SPOKEN__ || []).filter(s => /pipe|miles long|^2 miles/.test(s));
    const split = sp.some(s => /\d\.$/.test(s.trim())) && sp.some(s => /^\d/.test(s.trim()));
    ok(sp.length > 0 && !split, `[chunk-decimal] a number is never split at its decimal point between two utterances (${sp.map(s => JSON.stringify(s.slice(-22))).join(" | ")})`);
    win.__BUDDY_SPOKEN__ = [];
    api.voice.stop();
    api.voice.say(pad.slice(0, 190) + " It is named for Richard Henry Dana Jr., who sailed here in 1835. Next.", { id: "chunk-test2", now: true });
    await sleep(6000);
    const sp2 = (win.__BUDDY_SPOKEN__ || []).filter(s => /Dana|who sailed|named/.test(s));
    ok(sp2.length > 0 && !sp2.some(s => /^[,;]/.test(s.trim())), `[chunk-abbrev] no chunk starts with a comma after "Jr." (${sp2.map(s => JSON.stringify(s.slice(0, 16))).join(" | ")})`);
    // a long line is still cut into chunks of whole sentences of at most about 220 characters
    win.__BUDDY_SPOKEN__ = [];
    api.voice.stop();
    const long = Array.from({ length: 6 }, (_, i) => `Sentence ${i + 1} is about the road at mile ${i + 7}.5 and the hills beside it, ${"near ".repeat(6)}here.`).join(" ");
    api.voice.say(long, { id: "chunk-test3", now: true });
    await sleep(6000);
    const sp3 = (win.__BUDDY_SPOKEN__ || []).filter(s => /Sentence/.test(s));
    ok(sp3.length >= 2 && sp3.every(s => s.length <= 220 && /^Sentence \d/.test(s) && /here\.$/.test(s)) && sp3.join(" ") === long, `[chunk] a long line is spoken in whole sentences of at most 220 characters (${sp3.map(s => s.length).join(", ")})`);
    api.stopAll(false);
  }

  // R7. Mission lines: the exit and distance are said twice in a row ("At exit 54, Highway 76 heads about 4.5 miles east to Mission
  //     San Luis Rey. Exit 54 is Highway 76 east, the way to Mission San Luis Rey, about four and a half miles inland.").
  {
    const dup = PLACES.filter(p => { const t = api.narrator.announceText(p, 2, "N"); return (t.match(/\bexit \d+[A-Z]?\b/gi) || []).length > 1 && /^Exit \d/.test(p.text); });
    ok(dup.length === 0, `[mission-dup-exit] no landmark line says its exit twice in a row (${dup.slice(0, 4).map(p => p.id).join(", ") || "none"})`);
    // the shorter lines are made of the sentences recorded before (the natural voice keeps a clip for each), and the
    // turn-offs still say their exit once
    const U = api.voice.speechUnits, turns = PLACES.filter(p => api.data.detourSentence(p));
    const lc = t => t[0].toLowerCase() + t.slice(1);
    const subset = turns.every(p => [0, 2].every(d => {
      const old = d < 0.4 ? `${api.data.detourSentence(p)} ${p.text}` : `In about ${d} miles, ${lc(api.data.detourSentence(p))} ${p.text}`;
      const had = new Set(U(old));
      return U(api.narrator.announceText(p, d, "N")).every(u => had.has(u));
    }));
    const once = turns.every(p => (api.narrator.announceText(p, 2, "N").match(/\bexit \d+[A-Z]?\b/gi) || []).length === 1);
    ok(turns.length >= 5 && subset && once, `[mission-dup-exit] ${turns.length} turn-off lines keep their recorded sentences and say the exit once (${subset}, ${once})`);
  }

  out.innerHTML = (fails ? `<b class="fail">FAILED ${fails}</b>` : `<b class="pass">ALL PASS</b>`) + ` (${known} known bugs filed)\n` +
    lines.map(l => `<span class="${l.startsWith("PASS") ? "pass" : l.startsWith("FAIL") ? "fail" : "skip"}">${l.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`).join("\n");
  document.title = fails ? `FAILED ${fails}` : "ALL PASS";
}
document.getElementById("f").addEventListener("load", () => run().catch(e => { out.textContent = "ERROR " + e.stack; document.title = "ERROR"; }));
</script>
