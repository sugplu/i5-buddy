<!doctype html>
<meta charset="utf-8">
<title>I-5 Buddy: voice units</title>
<!-- Lists every unit the natural voice needs: it runs the app silently and asks the app's own functions for every line it
     can say (landmarks at every distance and side, zones, missions, games, navigation, fixed lines), cuts them with
     voice.speechUnits and names them with voice.unitKey. tools/voice/collect.py serves this page and saves the POST.
       ?lang=es    the app in Spanish (3.1.0, the voice Estrella): the same lines in the app's own Spanish words (t()),
                   for tools/voice/units-es.json
       ?only=kids  only what Stories for kids adds (3.1.0): each place's kids story, the way the heads-up, Hear it, Tell me
                   more and the 3D tour say it; every unit is tagged "kids" (collect.py --merge adds them to units.json)
     Without ?only=kids the list also has the kids lines, tagged "kids". English keeps the 3.0 sentences as they were
     written here (they are the clips' names), Spanish builds each from its key. -->
<script>window.__BUDDY_SILENT__ = true;</script>
<iframe id="app" style="width:390px;height:844px;border:0"></iframe>
<pre id="log"></pre>
<script type="module">
const log = t => { document.getElementById("log").textContent += t + "\n"; console.log("[units] " + t); };
const Q = new URLSearchParams(location.search);
const LANG = Q.get("lang") === "es" ? "es" : "en", ES = LANG === "es", ONLY_KIDS = Q.get("only") === "kids";
const fr = document.getElementById("app");
fr.src = `../../index.html?silent=1&lang=${LANG}`;
const wait = (test, ms) => new Promise(res => { const t0 = Date.now(); const iv = setInterval(() => { let v = null; try { v = test(); } catch {} if (v || Date.now() - t0 > ms) { clearInterval(iv); res(v); } }, 100); });

const api = await wait(() => fr.contentWindow.I5BUDDY && fr.contentWindow.I5BUDDY.api && fr.contentWindow.I5BUDDY.api.narrator && fr.contentWindow.I5BUDDY.api, 30000);
if (!api) { log("FAIL: the app never started"); throw new Error("no api"); }
await wait(() => api.missions, 8000);
await wait(() => api.play, 4000);
await wait(() => api.nav, 4000);
const D = api.data, N = api.narrator, V = api.voice, I = fr.contentWindow.I5BUDDY.i18n;
if (!I || I.LANG !== LANG) { log(`FAIL: the app is in ${I ? I.LANG : "?"}, not ${LANG}`); throw new Error("language"); }
if (ES && !(D.PLACES.filter(p => p.en && p.en.text).length > 300)) { log("FAIL: the Spanish stories (data/i5.es.js) did not load"); throw new Error("no Spanish data"); }
/** A line in this language: the app's own key in Spanish; in English the sentence as 3.0 wrote it here (the same words). */
const T = (key, vars, english) => (ES ? I.t(key, vars) : english);
const side$ = side => (ES ? D.sideSaid(side) : side);

const texts = new Map();   // text -> source
const direct = new Map();  // unit -> source (fixed phrases a caller passes as units)
const add = (t, src) => { if (typeof t === "string" && t.trim() && !texts.has(t)) texts.set(t, src); };
const unit = (u, src) => { if (typeof u === "string" && u.trim() && !direct.has(u)) direct.set(u, src); };
const DIST = [0, 1]; for (let n = 2; n <= 25; n++) DIST.push(n);
const kid0 = api.settings.kid, kids0 = api.settings.kidStories;

if (!ONLY_KIDS) {
  // Landmarks: every distance and side the narrator can use, with and without Kid mode's I spy line.
  api.settings.kidStories = false;
  for (const kid of [false, true]) {
    api.settings.kid = kid;
    for (const p of D.PLACES) for (const dir of ["N", "S"]) for (const d of DIST) add(N.announceText(p, d, dir), "place");
  }
  api.settings.kid = kid0;
  for (const p of D.PLACES) {
    add(T("nar.name_text", { name: p.name, text: p.text }, `${p.name}. ${p.text}`), "place");
    add(p.more ? T("nar.name_more", { name: p.name, more: p.more }, `${p.name}. ${p.more}`) : T("nar.thats_everything", { name: p.name, text: p.text }, `That's everything I have on ${p.name}. ${p.text}`), "more");
    if (p.more) add(T("nar.story_time", { name: p.name, more: p.more }, `Here's a story while we drive, about ${p.name}. ${p.more}`), "story");
  }
  // "What's on my left/right" (narrator.look): the lead before the place's name is its own unit
  const leadUnit = lead => (ES ? V.speechUnits(I.t("nar.lead_name_text", { lead, name: "X", text: "Y." }))[0] : lead + ":");
  for (const side of ["left", "right"]) {
    const sv = n => ({ side: side$(side), n });
    unit(leadUnit(T("nar.look_behind", sv(1), `Just behind us on your ${side}`)), "look");
    unit(leadUnit(T("nar.look_right_there", sv(1), `Right there on your ${side}`)), "look");
    for (let n = 1; n <= 8; n++) unit(leadUnit(n > 1 ? T("nar.look_n_miles_up", sv(n), `About ${n} miles up on your ${side}`) : T("nar.look_1_mile_up", sv(n), `About ${n} mile up on your ${side}`)), "look");
    add(T("nar.look_nothing", { side: side$(side) }, `Nothing I know about on your ${side} for the next few miles.`), "look");
  }
  // Landscape zones (narrator zoneLine and look's zone answer)
  for (const z of D.ZONES) {
    add(T("nar.now_passing", { label: z.label, text: z.text }, `Now passing: ${z.label}. ${z.text}`), "zone");
    for (const s of Object.values(z.seasons || {})) add(s, "zone");
    for (const side of ["left", "right"]) add(T("nar.look_zone", { side: side$(side), label: z.label, text: z.text }, `On your ${side} right now: ${z.label}. ${z.text}`), "zone");
  }
  // Fixed lines in the core
  add(T("nar.welcome_ca", null, "Welcome to California."), "core");
  const hv = { state: D.STATES[0].name, miles: Math.round(D.MAX_M / 2), south: D.ENDS.S.short, north: D.ENDS.N.short };
  add(T(D.SCOPE.length === 1 ? "nar.halfway_in_state" : "nar.halfway", hv,
    `You just crossed the halfway point of I-5${D.SCOPE.length === 1 ? " in " + D.STATES[0].name : ""}, about ${Math.round(D.MAX_M / 2)} miles from both ${D.ENDS.S.short} and ${D.ENDS.N.short}.`), "core");
  for (const e of ["S", "N"]) add(T("main.thats_long_the_end_of_the_road_for_i_5", { long: D.ENDS[e].long }, `That's ${D.ENDS[e].long}, the end of the road for I-5 Buddy. Thanks for riding along.`), "core");
  add(T("main.hi_im_your_i_5_buddy_ill_tell_you", { extra: ES ? I.t("main.this_is_a_demo_drive_ill_pretend_were") : "" },
    "Hi, I'm your I-5 buddy. I'll tell you about what's coming up as we drive. This is a demo drive. I'll pretend we're driving so you can hear how it works."), "core");
  add(T("main.this_is_how_ill_sound_on_the_road", null, "This is how I'll sound on the road."), "core");
  for (const d of D.DESTS) add(T("trip.we_made_it_to_name_2", { name: d.name }, `We made it to ${d.name}.`), "trip");
  // Modules that list their own lines
  const lists = [["missions", () => api.missions?.phrases?.()], ["play", () => api.play?.phrases?.()], ["nav", () => api.nav?.phraseBank?.()]];
  for (const [name, get] of lists) {
    let got = [];
    try { got = get() || []; } catch (e) { log(`${name}.phrases failed: ${e.message}`); }
    // nav.phraseBank() answers {units, sentences, count}; the others answer an array of sentences
    if (got && !Array.isArray(got)) got = [...(Array.isArray(got.units) ? got.units : []), ...(Array.isArray(got.sentences) ? got.sentences : [])];
    for (const t of got) { add(t, name); if (name === "nav") unit(t, name); }
    log(`${name}: ${got.length} lines`);
  }
  // Fixed sentences passed to say(...) anywhere in the app's code: English, the plain string literals (3.0); Spanish, a
  // key without blanks said as it is (say(t("nar.where_unknown"))). Ask Buddy (listen.js) answers in English in 3.1.0,
  // so it has no Spanish lines.
  for (const f of ["main", "narrator", "trip", "live", "play", "missions", "listen", "ride", "share", "roadahead", "map", "map3d", "nav", "feedback",
    ...(ES ? ["games/party", "games/speed", "games/plates", "games/higher", "games/where", "games/wyr", "games/hunt", "games/alpha", "games/cows", "games/kit"] : [])]) {
    if (ES && f === "listen") continue;
    let src = "";
    try { const r = await fetch(`../../js/${f}.js`); if (r.ok) src = await r.text(); } catch {}
    const re = ES ? /\b(?:say|userSay|gameSay|autoSay)\(\s*(?:i18n\.)?t\(\s*"([a-z0-9_]+(?:\.[a-z0-9_]+)+)"\s*\)/g : /\bsay\(\s*(["'`])((?:\\.|(?!\1)[^\\])*)\1/g;
    let m;
    while ((m = re.exec(src))) {
      if (ES) { add(I.t(m[1]), "literal:" + f); continue; }
      const s = m[2];
      if (m[1] === "`" && s.includes("${")) continue;
      add(s.replace(/\\(["'`\\])/g, "$1").replace(/\\n/g, " "), "literal:" + f);
    }
  }
}

// Stories for kids (3.1.0): with the setting on, a place's kids story replaces its story in the heads-up (every distance,
// side and Kid mode), Hear it, "What's on my left", Tell me more (a place without a long story) and the 3D tour; the
// sentences around it are the ones above. Tagged "kids": only Stories for kids says them.
api.settings.kidStories = true;
let kidsPlaces = 0;
for (const p of D.PLACES) {
  if (!p.kids) continue;
  kidsPlaces++;
  for (const kid of [false, true]) {
    api.settings.kid = kid;
    for (const dir of ["N", "S"]) for (const d of DIST) add(N.announceText(p, d, dir), "kids");
  }
  api.settings.kid = kid0;
  add(T("nar.name_text", { name: p.name, text: N.storyOf(p) }, `${p.name}. ${N.storyOf(p)}`), "kids");
  if (!p.more) add(T("nar.thats_everything", { name: p.name, text: N.storyOf(p) }, `That's everything I have on ${p.name}. ${N.storyOf(p)}`), "kids");
}
api.settings.kidStories = kids0;
log(`kids stories: ${kidsPlaces} places`);

// Cut, name, check for name clashes
const out = new Map(), clash = [];
// every source a unit comes from: a unit used only by long stories ("more", "story") can stream in the iPhone app, and one
// used only by the kids stories ("kids") is saved for offline only with Stories for kids on
const put = (u, src) => { u = u.replace(/\s+/g, " ").trim(); if (!u) return; const k = V.unitKey(u); const had = out.get(k); if (had && had.t !== u) clash.push([had.t, u]); else if (!had) out.set(k, { t: u, src: new Set([src.split(":")[0]]) }); else had.src.add(src.split(":")[0]); };
for (const [t, src] of texts) for (const u of V.speechUnits(t)) put(u, src);
for (const [u, src] of direct) put(u, src);
let chars = 0; for (const v of out.values()) chars += v.t.length;
log(`${LANG}${ONLY_KIDS ? " kids" : ""}: texts ${texts.size}, units ${out.size}, characters ${chars}, clashes ${clash.length}`);
const body = JSON.stringify({ when: new Date().toISOString(), lang: LANG, only: ONLY_KIDS ? "kids" : null, clashes: clash, units: [...out].map(([k, v]) => [k, v.t, [...v.src].join(",")]) });
const r = await fetch("/__units", { method: "POST", headers: { "content-type": "application/json" }, body });
log(r.ok ? "SAVED" : "POST failed " + r.status);
document.title = r.ok ? "ALL PASS" : "FAIL";
</script>
