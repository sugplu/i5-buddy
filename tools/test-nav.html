<title>I-5 Buddy navigation module test</title>
<!--
  Drives js/nav.js (the "normal GPS") inside the real app. Results: bottom bar + console "[test-nav] ...".
  ?s=      search | route | drive (each has its own page load) | view (leaves one screen up for a screenshot)
  ?v=      view: search | gate | preview | steps | guide | guide2 | hud | arrived | error      ?theme= dark | light      ?w= ?h= iframe size (default 390 x 844)
  search:  local results (a city, a landmark, a brand, an exit, a mission), the one-time notice before the first online search,
           Not now = local only, the debounce (3 letters, 350 ms), the abort of the old request on a new keystroke, offline,
           category chips, recents, Home and Work.
  route:   the preview with MapLibre blocked (the SVG sketch and the steps list), the summary (time, miles, arrival clock,
           "Mostly on I-5"), service errors, the notice before the first route request, Start turns GPS on.
  drive:   a simulated drive along a hand-made route (streets, an on-ramp, real I-5 coordinates, an exit, an arrival): the prompt
           sequence and their units, no duplicates, 8 s apart, the phrase bank, mute and the settings, the status line, the slim
           banner, one reroute, offline, one arrival, End, landmark narration while on I-5.
  The app loads as srcdoc with the service worker stubbed (see test-share.html). The place search and route service are a mock.
-->
<style>

  #bar{position:fixed;left:0;right:0;bottom:0;height:26px;padding:6px 8px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#111}
  #bar.pass{background:#0b6e3f}
  #bar.fail{background:#9b1d16}
</style>
</head>

<iframe id="f" title="I-5 Buddy under test"></iframe>
<div id="bar">starting…</div>
<script type="module">
const Q = new URLSearchParams(location.search), SCEN = Q.get("s") || "search", THEME = Q.get("theme") || "dark";
const f = document.getElementById("f");
f.style.width = (+(Q.get("w") || 390)) + "px";
f.style.height = (+(Q.get("h") || 844)) + "px";
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 6000, step = 40) {
  const t0 = performance.now();
  for (;;) { let v; try { v = fn(); } catch {} if (v) return v; if (performance.now() - t0 > ms) throw new Error("timed out waiting: " + fn.toString().slice(0, 120)); await wait(step); }
}
const checks = [];
function log(...a) { console.log("[test-nav] " + a.map(x => (typeof x === "string" ? x : JSON.stringify(x))).join(" ")); }
function check(name, ok, extra = "") { checks.push([name, !!ok]); log(`${ok ? "PASS" : "FAIL"} ${name}${extra ? " · " + extra : ""}`); }
function finish() {
  const bad = checks.filter(c => !c[1]).length, bar = document.getElementById("bar");
  bar.className = bad ? "fail" : "pass";
  bar.textContent = `${SCEN} · ${THEME} · ${checks.length - bad}/${checks.length} pass${bad ? " · FAIL: " + checks.filter(c => !c[1]).map(c => c[0]).join(", ") : ""}`;
  log(bad ? `RESULT FAILED ${bad}` : `RESULT ALL PASS (${checks.length})`);
}
const txt = n => (n ? n.textContent.replace(/\s+/g, " ").trim() : "");
const $ = (doc, sel) => doc.querySelector(sel);
const $$ = (doc, sel) => [...doc.querySelectorAll(sel)];
const sizeOK = b => { const r = b.getBoundingClientRect(); return r.width >= 43.5 && r.height >= 43.5; };

async function boot({ narr = false } = {}) {
  localStorage.clear();
  localStorage.setItem("i5b:settings", JSON.stringify({ live: false, theme: THEME, narr }));
  const html = await (await fetch("../index.html", { cache: "no-store" })).text();
  const stub = `<base href="${new URL("../", location.href).href}"><script>try{Object.defineProperty(navigator.serviceWorker,"register",{configurable:true,value:function(){return new Promise(function(){})}})}catch(e){}<\/script>`;
  f.srcdoc = html.replace(/<head>/i, "<head>" + stub);
  await until(() => f.contentDocument && f.contentDocument.readyState === "complete" && f.contentWindow.I5BUDDY && f.contentWindow.I5BUDDY.api.nav, 20000);
  await wait(200);
  const win = f.contentWindow, doc = f.contentDocument, api = win.I5BUDDY.api;
  api.settings.theme = THEME; doc.documentElement.dataset.theme = THEME;

}

/* ---------- the mock route service ---------- */
const D2R = Math.PI / 180;
const off = ([lat, lon], east, north) => [lat + north / 69.0, lon + east / (69.17 * Math.cos(lat * D2R))];
function seg(a, b, step = 0.02) {
  const L = Math.hypot((b[1] - a[1]) * 69.17 * Math.cos(a[0] * D2R), (b[0] - a[0]) * 69.0), n = Math.max(1, Math.ceil(L / step)), out = [];
  for (let i = 1; i <= n; i++) out.push([a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n]);
  return out;
}
/** A hand-made route in the Burbank area: three streets, an on-ramp onto I-5 (its real coordinates for six miles), exit 155,
    two more streets, arrival on the right. Returns {raw, pts, idx}. */
function makeRoute(api) {
  const at = m => api.geo.coordAt(m);
  const E = at(147.6), D = off(E, -0.45, -0.08), C = off(D, -0.5, 0), B = off(C, 0, 0.12), A = off(B, -0.35, 0);
  const geom = [A], idx = { A: 0 };
  const go = (name, pts) => { geom.push(...pts); idx[name] = geom.length - 1; };
  go("B", seg(A, B)); go("C", seg(B, C)); go("D", seg(C, D)); go("E", seg(D, E));
  const fw = []; for (let m = 147.65; m <= 154.0001; m += 0.05) fw.push(at(m));
  go("X", fw);
  const X = geom[idx.X], Y = off(X, 0.3, 0.22), Z = off(Y, 0, 0.14), W = off(Z, 0.3, 0);
  go("Y", seg(X, Y)); go("Z", seg(Y, Z)); go("W", seg(Z, W));
  const st = (type, from, to, o = {}) => ({ type, i0: idx[from], i1: idx[to], text: "", street: null, ref: null, exit: null, toward: null, roundabout_exit: null, speed_limit_mph: 35, ...o });
  const steps = [
    st("depart", "A", "B", { text: "Head east on Main Street", street: "Main Street" }),
    st("turn-right", "B", "C", { text: "Turn right onto Oak Street", street: "Oak Street" }),
    st("turn-left", "C", "D", { text: "Turn left onto Olive Avenue", street: "Olive Avenue" }),
    st("merge", "D", "X", { text: "Merge onto I-5 North", street: "I-5 North", ref: "I-5", speed_limit_mph: 65 }),
    st("exit-right", "X", "Y", { text: "Take exit 155 toward Sunland Boulevard", exit: "155", toward: "Sunland Boulevard", speed_limit_mph: 45 }),
    st("turn-left", "Y", "Z", { text: "Turn left onto Sunland Boulevard", street: "Sunland Boulevard" }),
    st("turn-right", "Z", "W", { text: "Turn right onto Hollywood Way", street: "Hollywood Way" }),
    { type: "arrive", i0: idx.W, i1: idx.W, text: "Arrive at your destination", side: "right", street: null, ref: null, exit: null, toward: null, roundabout_exit: null, speed_limit_mph: null },
  ];
  let total = 0;
  for (const s of steps) {
    const a = geom[s.i0], b = geom[s.i1];
    let d = 0; for (let i = s.i0; i < s.i1; i++) d += api.geo.miles(geom[i][0], geom[i][1], geom[i + 1][0], geom[i + 1][1]);
    s.distance_mi = Math.round(d * 100) / 100; s.duration_s = Math.round(d / (s.speed_limit_mph || 35) * 3600); total += d; void a; void b;
  }
  const dur = steps.reduce((x, s) => x + s.duration_s, 0);
  return { raw: { distance_mi: Math.round(total * 10) / 10, duration_s: dur, geometry: geom, steps, attribution: "© OpenStreetMap contributors · Geoapify" }, pts: { A, B, C, D, E, X, Y, Z, W }, idx };
}
/** The mock provider: search answers after 60 ms (and honours abort); route returns the hand-made route, or a short one from `from` to `to`. */
function mockProvider(api, over = {}) {
  const calls = { search: [], route: [] }, made = makeRoute(api);
  const p = {
    calls, made,
    search(q, pos, signal) {
      const c = { q, pos, signal, aborted: false }; calls.search.push(c);
      signal.addEventListener("abort", () => { c.aborted = true; });
      return new Promise((res, rej) => {
        const t = setTimeout(() => res({ results: [
          { id: "g1", name: "Costco Burbank", address: "1051 W Burbank Blvd, Burbank, CA 91506", lat: 34.1855, lon: -118.3295, kind: "poi", cat: "commercial.supermarket" },
          { id: "g2", name: "Costco Wholesale", address: "2121 N Victory Pl, Burbank, CA 91504", lat: 34.2012, lon: -118.3511, kind: "poi", cat: "commercial.supermarket" },
          { id: "g3", name: "Costco Gasoline", address: "1051 W Burbank Blvd, Burbank, CA", lat: 34.1858, lon: -118.3301, kind: "poi", cat: "service.fuel" },
        ], attribution: "© OpenStreetMap contributors · Geoapify" }), 60);
        signal.addEventListener("abort", () => { clearTimeout(t); const e = new Error("aborted"); e.aborted = true; rej(e); });
      });
    },
    route(from, to, heading, signal) {
      calls.route.push({ from, to, heading, signal });
      if (over.route) return over.route(from, to, heading, signal, calls.route.length);
      if (calls.route.length === 1 || over.always) return Promise.resolve(JSON.parse(JSON.stringify(made.raw)));
      // a reroute: from here to the same destination, two streets
      const a = [from.lat, from.lon], b = [to.lat, to.lon], g = [a, ...seg(a, b, 0.03)];
      return Promise.resolve({ distance_mi: 0.5, duration_s: 90, geometry: g, steps: [
        { type: "depart", i0: 0, i1: g.length - 1, text: "Head toward your destination", speed_limit_mph: 25 },
        { type: "arrive", i0: g.length - 1, i1: g.length - 1, side: null } ] });
    },
  };
  return p;
}
const NEARBY = { lat: 34.19, lon: -118.33 };
function setConsent(api, v) { api.store.set("nav:consent", v); }
function fakeGeo(win, here) {
  win.__I5_FAKE_GEO__ = { watchPosition() { return 1; }, clearWatch() {}, getCurrentPosition(ok) { ok({ coords: { latitude: here.lat, longitude: here.lon, accuracy: 10 } }); } };
  win.__calls = [];
}
/** Watch what nav hands to the speech queue (the real one still runs, silently). */
function spy(api) {
  const calls = [], real = api.voice.say.bind(api.voice);
  api.voice.say = (text, opts = {}) => { calls.push({ text, ...opts, units: opts.units ? opts.units.slice() : undefined }); return real(text, opts); };
  return calls;
}
const navCalls = calls => calls.filter(c => /^nav:/.test(c.id || ""));

    // --- a second drive: mute, alerts only, street names, from a demo start
    const mock2 = mockProvider(api); nav.setProvider(mock2);
    await nav.preview(dest);
    api.S.mode = "off";
    api.settings.navVoice = "alerts"; api.saveSettings();
    nav.start({ gps: false });
    nav.simulate({ mph: 65, sync: true, until: 5 });
    const al = T.log().filter(x => /^nav:r\d+:\d+:/.test(x.id));
    const alSpoken = al.filter(x => x.spoken);
    check("in Alerts only mode just the final prompts speak (the early ones are not said)", alSpoken.length > 0 && alSpoken.every(x => x.kind === "final") && al.some(x => x.kind === "adv" && !x.spoken), `${alSpoken.length} of ${al.length}`);
    api.settings.navVoice = "off"; api.saveSettings();
    nav.simulate({ mph: 65, sync: true, until: 8 });
    check("in Off mode nothing speaks", T.log().filter(x => x.spoken && x.t > al[al.length - 1].t).length === 0);
    api.settings.navVoice = "full"; api.saveSettings();
    nav.setMuted(true);
    check("mute silences nav prompts only, and is remembered", nav.muted() && api.store.get("nav:mute") === true);
    nav.end(); await wait(50);
    check("a drive that started from a demo ends with it (mode off again)", api.S.mode === "off", api.S.mode);
    api.stopAll(true);
    nav.setMuted(false);
    // street names
    api.settings.navStreets = true; api.saveSettings();
    nav.setProvider(mockProvider(api)); await nav.preview(dest);
    check("the settings sheet has the voice setting and the street names toggle", !!$(doc, "#navSettings") && $$(doc, "#navSettings [data-nav-voice]").map(txt).join("|") === "Full|Alerts only|Off" && /Say street names \(uses the phone's voice\)/.test(txt($(doc, "#navSettings"))));
    nav.start({ gps: false });
    nav.simulate({ mph: 65, sync: true, until: 0.6 });
    const st = T.log().filter(x => /^nav:r\d+:\d+:/.test(x.id));
    check("with street names on, the provider's words are spoken and no units are passed", st.length >= 1 && /Oak Street|Olive Avenue/.test(st[0].text) && st.every(x => x.units === null) && navCalls(said).filter(c => /^nav:r\d+:\d+:/.test(c.id)).slice(-st.length).every(c => c.units === undefined), st.map(x => x.text).join(" | "));
    api.settings.navStreets = false; api.saveSettings();
    nav.end(); await wait(50); api.stopAll(true);

    // --- off route: exactly one reroute, a clock that respects the 10 s rule, then offline
    const mock3 = mockProvider(api); nav.setProvider(mock3);
    await nav.preview(dest);
    nav.start({ gps: false });
    const geom = nav.route().geometry;
    let clock = T0;
    nav._test.setClock(() => clock);
    const fix = (lat, lon, o = {}) => { clock += o.dt ?? 1000; const hit = api.geo.locate(lat, lon); T.fix({ lat, lon, accuracy: 8, m: hit.m, dist: hit.dist, offRoute: hit.dist > 1.2, speed: o.mph ?? 30, heading: o.hd ?? 90, t: clock }); };
    for (let i = 0; i < 12; i++) fix(geom[i * 3][0], geom[i * 3][1]);
    check("on the route there is no reroute", mock3.calls.route.length === 1 && ev["nav:reroute"].length === 0 && T.N.offCount === 0);
    const base = geom[40], far = [base[0] + 0.0032, base[1]];       // about 350 m north of the road
    fix(far[0], far[1]); fix(far[0] + 0.0002, far[1]);
    check("two fixes off the route do nothing yet", mock3.calls.route.length === 1);
    fix(far[0] + 0.0004, far[1]);
    await wait(80);
    check("three in a row while moving: Rerouting. and exactly one new route request, from here, with the heading", mock3.calls.route.length === 2 && ev["nav:reroute"].length === 1 && mock3.calls.route[1].heading != null && Math.abs(mock3.calls.route[1].from.lat - (far[0] + 0.0004)) < 1e-6, String(mock3.calls.route.length));
    check("it said Rerouting. once, as an alert", T.log().filter(x => /^nav:reroute:/.test(x.id)).length === 1 && T.log().find(x => /^nav:reroute:/.test(x.id)).text === "Rerouting." && T.log().find(x => /^nav:reroute:/.test(x.id)).now === true);
    const newRoute = nav.route();
    check("the new route replaced the old one and nav:route fired for it", newRoute.id !== route.id && ev["nav:route"].length >= 2 && Math.abs(newRoute.geometry[0][0] - (far[0] + 0.0004)) < 1e-6);
    for (let i = 0; i < 4; i++) fix(far[0] + 0.0004, far[1] + 0.0003 * i);
    await wait(30);
    check("fixes near the new route cause no more requests", mock3.calls.route.length === 2, String(mock3.calls.route.length));
    // off again inside 10 s: the rate limit holds; after 10 s it goes
    const hereLat = newRoute.geometry[newRoute.geometry.length - 1][0], hereLon = newRoute.geometry[newRoute.geometry.length - 1][1];
    clock += 1; for (let i = 0; i < 3; i++) fix(hereLat + 0.01, hereLon + 0.01 + i * 1e-4, { dt: 1000 });
    await wait(30);
    check("at most one reroute per 10 s", mock3.calls.route.length === 2, String(mock3.calls.route.length));
    clock += 11000;
    for (let i = 0; i < 3; i++) fix(hereLat + 0.01, hereLon + 0.012 + i * 1e-4, { dt: 1000 });
    await wait(60);
    check("after 10 s it asks again", mock3.calls.route.length === 3, String(mock3.calls.route.length));
    // offline: the no-connection line once, retried when the signal is back
    Object.defineProperty(win.navigator, "onLine", { configurable: true, get: () => false });
    clock += 11000;
    const nb = mock3.calls.route.length;
    for (let i = 0; i < 6; i++) fix(hereLat + 0.02, hereLon + 0.02 + i * 1e-4, { dt: 1000 });
    await wait(30);
    const offl = T.log().filter(x => x.text === "No connection. Keep going, and I'll reroute when the signal is back.");
    check("offline: the no-connection line is said once and no request goes out", offl.length === 1 && mock3.calls.route.length === nb, `${offl.length} ${mock3.calls.route.length - nb}`);
    delete win.navigator.onLine;
    win.dispatchEvent(new win.Event("online"));
    await wait(60);
    check("when the signal is back it asks again", mock3.calls.route.length === nb + 1);
    nav.end(); await wait(50);
    nav._test.setClock(() => T0);
    check("ending a drive says Navigation ended. (an alert)", T.log().filter(x => x.text === "Navigation ended.").length === 1 && T.log().find(x => x.text === "Navigation ended.").now === true);
    api.stopAll(true);

    // --- a drive from no GPS at all: the demo mode comes on and goes off with the drive; landmark narration plays on I-5
    api.settings.narr = true; api.saveSettings();
    const mock4 = mockProvider(api); nav.setProvider(mock4);
    await nav.preview(dest);
    check("before: tracking off", api.S.mode === "off");
    nav.start({ gps: false });
    const before = said.length;
    nav.simulate({ mph: 65, sync: true, until: 6 });
    await wait(150);
    check("a simulated drive turns demo mode on (and the pill says NAV)", api.S.mode === "demo");
    const lm = said.slice(before).filter(c => !/^nav:/.test(c.id || "") && (c.prio === 1));
    check("on I-5 the landmark narration keeps going (priority 1) while nav guides", ev["place:announce"].length >= 1 && lm.length >= 1, `${ev["place:announce"].length} announced, ${lm.length} said`);
    check("and nav prompts outrank it (priority 3, interrupting)", navCalls(said.slice(before)).every(c => c.prio === 3));
    nav.stopSimulate();
    check("stopSimulate ends the demo it started", api.S.mode === "off" && nav.state() === "navigating");
    nav.end(); await wait(50);
    check("End: the normal app, everything cleared", $(doc, "#navView").hidden && nav.state() === "idle" && !T.N.sim);
    const de = doc.documentElement;
    check("no horizontal page scroll", de.scrollWidth <= de.clientWidth, `${de.scrollWidth} vs ${de.clientWidth}`);
  },

  /* ------------------------------------------------ view (screens for a screenshot) ------------------------------------------------ */
  async view({ win, doc, api }) {
    const nav = api.nav, v = Q.get("v") || "preview";
    nav._test.setClock(() => new Date(2026, 10, 16, 14, 0).getTime());
    setConsent(api, v === "gate" ? null : "yes");
    api.S.lat = NEARBY.lat; api.S.lon = NEARBY.lon;
    fakeGeo(win, NEARBY);
    api.setMode("gps"); api.setPosition(150, { dir: "N", speed: 0, jumped: true });
    const mock = mockProvider(api); nav.setProvider(mock);
    const dest = { name: "Hollywood Way Diner", address: "300 N Hollywood Way, Burbank, CA", lat: mock.made.pts.W[0], lon: mock.made.pts.W[1], kind: "poi", m: 151 };
    if (v === "search" || v === "gate") {
      api.store.set("nav:recent", [{ name: "Costco Burbank", address: "1051 W Burbank Blvd, Burbank", lat: 34.18, lon: -118.33, kind: "poi" }, { name: "Sacramento", address: "On I-5", lat: 38.58, lon: -121.5, kind: "city", m: 519 }]);
      api.store.set("nav:fav", { home: { name: "Home: 12 Oak St", address: "Burbank", lat: 34.2, lon: -118.3, kind: "address" }, work: null });
      nav.openSearch(v === "gate" ? "costco" : "");
      if (v === "gate") await wait(450);
      await wait(200);
    } else {
      await nav.preview(dest);
      if (v === "error") { /* shown by the mock below */ }
      if (v === "steps") { $$(doc, ".nav-pv-acts button")[1].click(); }
      if (v === "guide" || v === "guide2" || v === "arrived" || v === "hud") {
        nav.start({ gps: false });
        nav.simulate({ mph: 65, sync: true, until: v === "guide" || v === "hud" ? 0.4 : v === "guide2" ? 4.9 : 1e9 });
        if (v === "hud") { await wait(300); const hb = $(doc, ".nav-hud-btn"); if (hb) hb.click(); }
      }
      await wait(1500);
    }
    { const nv = $(doc, "#navView"); log("view", v, "map=" + (nv && nv.dataset.map), "mode=" + (nv && nv.dataset.mode), "canvas=" + !!(nv && nv.querySelector("canvas")), "sketchHidden=" + !!(nv && nv.querySelector(".nav-sketch") && nv.querySelector(".nav-sketch").hidden)); }
    { const m = api.nav._test.V.map; if (m) { for (let i = 0; i < 40; i++) { try { m.triggerRepaint(); await fetch("../manifest.webmanifest?w=" + i, { cache: "no-store" }); } catch {} }
        log("map", { styleLoaded: m.isStyleLoaded(), layers: (m.getStyle().layers || []).filter(l => /^nav-/.test(l.id)).map(l => l.id), center: m.getCenter(), zoom: m.getZoom(), pitch: m.getPitch(), src: !!m.getSource("nav-route"), grad: JSON.stringify(m.getPaintProperty("nav-route-line", "line-gradient")) }); } }
    check("view ready: " + v, true);
  },
};

(async () => {
  try {
    const ctx = await boot({ narr: SCEN === "drive" ? false : false });
    await SCENARIOS[SCEN](ctx);
  } catch (e) {
    check("test ran", false, String((e && e.stack) || e).replace(/\n\s*/g, " | "));
  }
  finish();
})();
</script>
