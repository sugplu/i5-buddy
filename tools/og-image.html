<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I-5 Buddy link preview (1200x630)</title>
<!--
  The link-preview picture (og:image, twitter:image): icons/og-1200x630.png.
  Drawn with the app's own night tokens and Overpass font (../app.css), the Interstate shield and the green sign board,
  with Made by Dominares and its mark (as in the app's About card) beside the address.
  No photos. The ribbon has a tick for every other landmark ahead of the dot, read from ../data/i5.js.

  To re-render after a change:  python3 tools/og_image.py   (headless Chrome; writes icons/og-1200x630.png at
  exactly 1200x630), then bump VERSION in sw.js. To look at it, serve the repo root and open /tools/og-image.html.
  Keep the shield and the Dominares mark below in step with index.html (the #shield symbol, the About card's mark).
-->
<link rel="stylesheet" href="../app.css">
<style>
  /* A fixed 1200x630 page. Headless Chrome's viewport is shorter than --window-size, so nothing here may depend on it:
     the root gets a plain color and the body paints its own gradient inside its own box. */
  html{height:auto;background:var(--bg)}
  body{margin:0;width:1200px;height:630px;overflow:hidden;position:relative;font-family:var(--display);color:var(--fg);
    background:radial-gradient(120% 90% at 18% 0%,var(--surface) 0%,var(--bg) 62%) no-repeat}
  /* the guide sign, at hero size: same green, same white inner edge as the app's sign board */
  .og-sign{position:absolute;left:56px;right:56px;top:52px;height:404px;border-radius:30px;background:var(--sign);color:var(--sign-fg);
    box-shadow:inset 0 0 0 9px var(--sign),inset 0 0 0 15px var(--sign-edge),0 26px 60px rgba(0,0,0,.55);
    padding:50px 64px 0 58px;display:grid;grid-template-columns:auto 1fr;column-gap:40px;align-content:start}
  .og-shield{width:166px;height:178px;display:block;grid-row:1 / span 2;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
  .og-name{margin:2px 0 0;font-weight:900;font-size:136px;line-height:1;letter-spacing:-.005em;white-space:nowrap}
  .og-line{margin:18px 0 0;font-weight:700;font-size:41px;line-height:1.18;text-wrap:balance;max-width:820px}
  /* the route ribbon from the app, with a tick for every other landmark ahead of the dot */
  .og-ribbon{position:absolute;left:60px;right:60px;bottom:50px;height:30px}
  .og-ribbon .track{position:absolute;left:0;right:0;top:11px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
  .og-ribbon .ca{position:absolute;inset:0;background:var(--st-ca);opacity:.42}
  .og-ribbon .done{position:absolute;left:0;top:11px;height:8px;border-radius:4px;background:#fff;opacity:.9;width:38%}
  .og-ribbon i{position:absolute;top:8px;width:1px;height:14px;background:rgba(255,255,255,.3)}
  .og-ribbon .you{position:absolute;top:2px;left:38%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 5px rgba(0,0,0,.15)}
  /* the address, in the app's link yellow */
  .og-url{position:absolute;left:60px;bottom:60px;margin:0;font-family:var(--mono);font-weight:700;font-size:46px;line-height:1;color:var(--accent);letter-spacing:.01em}
  /* the parent brand, as in the app's About card: the Dominares mark in emerald, the words in the byline's green */
  .og-by{position:absolute;right:60px;bottom:58px;margin:0;display:flex;align-items:center;gap:14px;font-weight:800;font-size:32px;line-height:1;color:var(--dom);letter-spacing:.02em}
  .og-by svg{width:52px;height:46px;flex:none;color:var(--dom-mark)}
</style>
</head>
<body>
<div class="og-sign">
  <svg class="og-shield" viewBox="0 0 58 62" aria-hidden="true">
    <path d="M4 4 Q29 0 54 4 Q58 36 29 60 Q0 36 4 4Z" fill="#fff"/>
    <path d="M7 7 Q29 3.5 51 7 L51.6 17 H6.4Z" fill="#c8202f"/>
    <path d="M6.4 19 H51.6 Q52 38 29 56 Q6 38 6.4 19Z" fill="#1f4aa8"/>
    <text x="29" y="14.6" text-anchor="middle" font-family="Overpass,Arial,sans-serif" font-weight="800" font-size="7" fill="#fff">INTERSTATE</text>
    <text x="29" y="47" text-anchor="middle" font-family="Overpass,Arial,sans-serif" font-weight="900" font-size="27" fill="#fff">5</text>
  </svg>
  <h1 class="og-name">I-5 Buddy</h1>
  <p class="og-line">A free guide that tells you about I-5 in California as you drive</p>
  <div class="og-ribbon" id="ribbon" aria-hidden="true">
    <div class="track"><div class="ca"></div></div>
    <div class="done"></div>
    <div class="you"></div>
  </div>
</div>
<p class="og-url">i5.dominares.org</p>
<p class="og-by"><svg viewBox="0 0 113 100" aria-hidden="true"><g transform="translate(24.93 0) skewX(-14)" fill="currentColor"><path d="M0 0H20V80H60V100H0Z"/><path d="M28 0H64L88 24V76L68 96V20H28Z"/><path d="M35 41H53V59H35Z"/></g></svg>Made by Dominares</p>
<script src="../data/i5.js"></script>
<script>
  // a tick for the landmarks still ahead of the dot, like the app's ribbon (every other one: at this size all 375
  // at once read as a solid bar)
  (function () {
    var D = window.I5DATA, r = document.getElementById("ribbon");
    if (!D || !D.places || !D.states || !D.states.length) return;
    var max = D.states[D.states.length - 1].to, at = 0.38, frag = document.createDocumentFragment();
    D.places.forEach(function (p, i) {
      if (i % 2 || p.m / max < at + 0.012) return;
      var t = document.createElement("i");
      t.style.left = (p.m / max * 100) + "%";
      frag.appendChild(t);
    });
    r.insertBefore(frag, r.querySelector(".you"));
  })();
</script>
</body>
</html>
