<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I-5 Buddy live module test</title>
<!--
  Drives the live module (js/live.js) inside the real app and checks it. Results: bottom bar + console "[test-live] ...".
  ?s=      mock (default) | traffic | trafficold | optin | cadence | timers | south | north | la | fail | nopos | end | real | unit
           speech | chains | alertupd | deadzone | partial | nowx | srcfail | toggle | retry | camvis
           (north: the last miles before the Oregon line and past it; la: a Caltrans camera strip and side-by-side weather)
  ?theme=  dark | light       ?view= top | more | block | wx | cams | sheet-cam | sheet-alert | sheet-chain | sheet-wx
  ?w= ?h=  iframe width and height (default 430 x 932)   ?m= & ?dir= start mile and direction for s=real
  ?tap=no|on (optin) also taps "Not now" or "Turn on"   ?names=1 (unit) logs every camera name the cleaner changes
  ?next=1  (sheet-cam) taps "Farther"          ?sw=1 loads index.html itself, with its service worker
  ?speech=real  keeps the browser's own speechSynthesis (default: a fake one, so voice.js's queue really runs)
  ?dbg=1   (speech) logs every synthesizer event and every item voice.js starts, with times
  traffic, trafficold: /api/traffic answers from tools/traffic-sample.json (rewritten to the current time); the other
  scenarios leave it unanswered, like a phone with no route to the server.
  Mocked scenarios answer weather.gov and Caltrans from tools/live/*.json (real feeds saved earlier; statuses edited to
  show chain controls and a two-page sign). s=real uses the network. Long virtual budgets: s=timers 400000,
  s=speech 300000, s=alertupd 900000, s=retry 1500000, s=camvis 150000.
  By default the app is loaded as srcdoc with service-worker registration stubbed: in a fresh headless profile the
  worker claims the page mid-test and main.js reloads it. ?sw=1 keeps the real behavior (the run is retried once).
-->
<style>
  html,body{margin:0;background:#2b2f2d;color:#e8ece9;font:12px/1.35 ui-monospace,Menlo,monospace}
  #f{display:block;width:430px;height:932px;border:0;background:#000}
  #bar{position:fixed;left:0;right:0;bottom:0;height:26px;padding:6px 8px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#111}
  #bar.pass{background:#0b6e3f}
  #bar.fail{background:#9b1d16}
  #log{display:none;margin:0;padding:10px 10px 40px;white-space:pre-wrap;word-break:break-word}
  body.unit #f{display:none}
  body.unit #log{display:block}
</style>
</head>
<body>
<iframe id="f" title="I-5 Buddy under test"></iframe>
<pre id="log"></pre>
<div id="bar">starting…</div>
<script type="module">
const Q = new URLSearchParams(location.search);
const SCEN = Q.get("s") || "mock", THEME = Q.get("theme") || "dark", VIEW = Q.get("view") || "top";
const f = document.getElementById("f");
f.style.width = (+(Q.get("w") || 430)) + "px";
if (Q.get("h")) f.style.height = (+Q.get("h")) + "px";
if (SCEN === "unit") document.body.classList.add("unit");
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 6000, step = 40) {
  const t0 = performance.now();
  for (;;) { let v; try { v = fn(); } catch {} if (v) return v; if (performance.now() - t0 > ms) throw new Error("timed out waiting"); await wait(step); }
}
const checks = [], lines = [];
function log(...a) {
  const s = a.map(x => (typeof x === "string" ? x : JSON.stringify(x))).join(" ");
  lines.push(s); console.log("[test-live] " + s);
  document.getElementById("log").textContent = lines.join("\n");
}
function check(name, ok, extra = "") { checks.push([name, !!ok]); log(`${ok ? "PASS" : "FAIL"} ${name}${extra ? " · " + extra : ""}`); }
function finish() {
  const bad = checks.filter(c => !c[1]).length;
  const bar = document.getElementById("bar");
  bar.className = bad ? "fail" : "pass";
  bar.textContent = `${SCEN} · ${THEME} · ${VIEW} · ${checks.length - bad}/${checks.length} pass${bad ? " · FAIL: " + checks.filter(c => !c[1]).map(c => c[0]).join(", ") : ""}`;
  log(bad ? `RESULT FAILED ${bad}` : `RESULT ALL PASS (${checks.length})`);
}

/* ---------- fresh app state (same origin: this is the app's localStorage; see resetStorage) ---------- */
const LIVE0 = { optin: null, toggle: null, nopos: true };   // settings.live at start (default false: the test turns it on)
const live0 = SCEN in LIVE0 ? LIVE0[SCEN] : false;
const NOW = Date.now(), MIN = 60e3;

/* ---------- a fake speech synthesizer (runs inside the app before its modules load) ----------
   Utterances "play" for 150 ms + 25 ms per character of virtual time, cancel() interrupts like Chrome does,
   so voice.js's real queue (priorities, now:true, stop) runs exactly as on a phone. ?speech=real turns it off. */
function fakeSpeech() {
  var log = window.__speech = [];
  function U(t) { this.text = String(t == null ? "" : t); this.lang = ""; this.rate = 1; this.pitch = 1; this.volume = 1; this.voice = null; this.onstart = this.onend = this.onerror = null; }
  var q = [], cur = null, timer = 0;
  var synth = {
    speaking: false, paused: false, pending: false,
    getVoices: function () { return [{ name: "Test Voice", lang: "en-US", voiceURI: "test-voice", default: true, localService: true }]; },
    addEventListener: function () {}, removeEventListener: function () {},
    speak: function (u) { q.push(u); synth.pending = true; go(); },
    cancel: function () {
      var c = cur, w = q;
      q = []; cur = null; clearTimeout(timer); synth.speaking = false; synth.pending = false;
      if (c) { if (c.text.trim()) log.push({ t: Date.now(), ev: "cut", text: c.text }); if (c.onerror) c.onerror({ error: "interrupted" }); }
      w.forEach(function (u) { if (u.onerror) u.onerror({ error: "canceled" }); });
    },
    pause: function () {}, resume: function () {},
  };
  function go() {
    if (cur || !q.length) return;
    var u = cur = q.shift();
    synth.pending = q.length > 0; synth.speaking = true;
    if (u.text.trim()) log.push({ t: Date.now(), ev: "start", text: u.text });
    if (u.onstart) u.onstart({});
    timer = setTimeout(function () {
      if (cur !== u) return;
      cur = null; synth.speaking = false;
      if (u.text.trim()) log.push({ t: Date.now(), ev: "end", text: u.text });
      if (u.onend) u.onend({});
      go();
    }, 150 + u.text.length * 25);
  }
  try { Object.defineProperty(window, "speechSynthesis", { configurable: true, get: function () { return synth; } }); } catch (e) {}
  window.SpeechSynthesisUtterance = U;
}

/** Replace voice.say with a recorder. play: the item "starts" at once (onstart runs) and resolves true. */
function stubSay(api, play = true) {
  const said = [];
  api.voice.say = (text, o = {}) => {
    said.push({ text, ...o, check: undefined, onstart: undefined, t: Date.now() });
    if (play) { try { o.onstart && o.onstart(); } catch {} }
    return Promise.resolve(!!play);
  };
  return said;
}
/** Ids waiting in voice.js's queue (not the one speaking). */
const voiceWaiting = api => (api.voice.queued ? api.voice.queued() : []).map(x => String(x == null ? "" : x));
/** Every item voice.js starts, in order (the "speaking" event). */
function recordSpeech(api) {
  const spoken = [];
  api.bus.on("speaking", s => { if (s) spoken.push({ id: String(s.id == null ? "" : s.id), text: s.text, t: Date.now() }); });
  return spoken;
}
/** A fake GPS for startGps(): a fix every second, driving north at 63 mph from mile m0. */
function fakeGps(win, m0) {
  const g = { m: m0, timer: 0, fixes: 0 };
  win.__I5_FAKE_GEO__ = {
    watchPosition(ok) {
      const tick = () => {
        const [lat, lon] = win.I5BUDDY.coordAt(g.m);
        g.fixes++;
        ok({ coords: { latitude: lat, longitude: lon, accuracy: 8, speed: 28, heading: null, altitude: null }, timestamp: Date.now() });
        g.m += 28 * 2.23694 / 3600;
      };
      win.setTimeout(tick, 300);
      g.timer = win.setInterval(tick, 1000);
      return 7;
    },
    clearWatch() { win.clearInterval(g.timer); },
  };
  return g;
}
/** The live module's own instance (same URL as main.js's import), for its _test hooks. */
async function liveMod(win, doc) {
  if (!win.__liveMod) {
    const s = doc.createElement("script");
    s.type = "module";
    s.textContent = "import * as m from './js/live.js'; window.__liveMod = m;";
    doc.head.append(s);
  }
  return (await until(() => win.__liveMod, 4000))._test;
}
/** Cameras between two miles show a local picture instead of the live one: headless virtual time stands still while
    a camera server answers (2 to 5 s each near Yreka), and these scenarios test the strip, not the pictures. */
function localCams(api, from, to) {
  api.data.CAMS.forEach((c, i) => { if (c.m >= from && c.m <= to) c.img = `icons/icon-192.png?cam=${i}`; });
}
/** Wait out the 2-minute rule (virtual time), then refresh and wait for it to land. */
async function refreshNow(api) {
  const left = api.live.status().netT + 120e3 - Date.now();
  if (left > 0) await wait(left + 200);
  await api.live.refresh();
  await wait(100);
}

/* ---------- samples from tools/live (real Caltrans answers saved earlier) ---------- */
const SAMPLE = {};
async function sample(name) {
  if (!SAMPLE[name]) { const r = await fetch("live/" + name); SAMPLE[name] = { status: r.status, buf: await r.arrayBuffer() }; }
  return SAMPLE[name];
}
const json = buf => JSON.parse(new TextDecoder().decode(buf));

/* ---------- fake weather.gov ---------- */
// Town names by corridor mile. The ones past mile 797 (Oregon and Washington) only come up in a build of the data that
// covers those states; a California-only road ends at the Oregon line.
const TOWNS = [[0, "San Ysidro"], [17, "San Diego"], [54, "Oceanside"], [109, "Anaheim"], [135, "Los Angeles"], [168, "Santa Clarita"], [199, "Gorman"],
  [215, "Grapevine"], [309, "Kettleman City"], [403, "Los Banos"], [450, "Tracy"], [473, "Stockton"], [490, "Lodi"], [519, "Sacramento"],
  [577, "Williams"], [649, "Red Bluff"], [677, "Redding"], [700, "Lakehead"], [712, "Lamoine"], [724, "Castella"], [730, "Dunsmuir"],
  [738, "Mount Shasta"], [748, "Weed"], [776, "Yreka"], [790, "Hornbrook"], [816, "Ashland"], [827, "Medford"], [855, "Grants Pass"],
  [880, "Wolf Creek"], [921, "Roseburg"], [991, "Eugene"], [1050, "Salem"], [1097, "Portland"], [1141, "Longview"], [1210, "Olympia"],
  [1238, "Tacoma"], [1270, "Seattle"], [1297, "Everett"], [1358, "Bellingham"], [1381, "Blaine"]];
function town(m) { let b = TOWNS[0]; for (const t of TOWNS) if (Math.abs(t[0] - m) < Math.abs(b[0] - m)) b = t; return b[1]; }
function iso(t) { return new Date(t).toISOString(); }
function forecastFor(api, m) {
  const ft = api.data.elevAt(m) || 0;
  const hi = Math.round(64 - ft / 1000 * 6), lo = hi - 15;
  const wet = m > 690 && m < 830, snowy = ft > 2000;
  const p = (n, name, day, temp, short, wind, pop, detail) => ({ number: n, name, startTime: iso(NOW + (n - 1) * 12 * 3600e3 - 3600e3), endTime: iso(NOW + n * 12 * 3600e3 - 3600e3),
    isDaytime: day, temperature: temp, temperatureUnit: "F", windSpeed: wind, windDirection: "S", shortForecast: short, probabilityOfPrecipitation: { value: pop }, detailedForecast: detail });
  return { properties: { periods: [
    p(1, "This Afternoon", true, hi, wet ? (snowy ? "Rain And Snow Showers Likely" : "Rain Likely") : "Sunny", wet ? "10 to 20 mph" : "5 mph", wet ? 80 : 0, wet ? `Rain likely, mixed with snow above ${snowy ? 2000 : 3000} feet. High near ${hi}. Breezy.` : `Sunny, with a high near ${hi}.`),
    p(2, "Tonight", false, lo, wet ? (snowy ? "Snow Showers" : "Rain And Snow") : "Mostly Clear", wet ? "15 mph" : "3 mph", wet ? 90 : 0, wet ? `Snow showers. Low around ${lo}. New snow accumulation of 3 to 7 inches possible.` : `Mostly clear, with a low around ${lo}.`),
    p(3, "Wednesday", true, hi - 3, wet ? "Snow Showers Likely then Partly Sunny" : "Sunny", "10 mph", wet ? 60 : 0, "Snow showers likely before 11am, then partly sunny."),
    p(4, "Wednesday Night", false, lo - 2, "Partly Cloudy", "5 mph", 10, "Partly cloudy, with a low around " + (lo - 2) + "."),
  ] } };
}
/* The Shasta warning. NWS gives each update of a product a new id (messageType "Update") that lists the earlier ids
   in properties.references; s=alertupd changes v, refs and event between refreshes. */
const WSW = { v: 1, refs: true, event: "Winter Storm Warning" };
function alertsFor(m) {
  const feats = [];
  const A = (id, event, severity, area, extra = {}) => feats.push({ id: "urn:oid:mock." + id, properties: Object.assign({
    id: "urn:oid:mock." + id, areaDesc: area, status: "Actual", messageType: "Alert", severity, event, senderName: "NWS Sacramento CA",
    onset: iso(NOW - 2 * 3600e3), effective: iso(NOW - 2 * 3600e3), expires: iso(NOW + 8 * 3600e3), ends: iso(NOW + 20 * 3600e3),
    headline: event + " issued by NWS", description: "", instruction: "", parameters: {} }, extra) });
  const refs = WSW.refs ? Array.from({ length: WSW.v - 1 }, (_, i) => ({ "@id": `https://api.weather.gov/alerts/urn:oid:mock.wsw.${i + 1}`,
    identifier: `urn:oid:mock.wsw.${i + 1}`, sender: "w-nws.webmaster@noaa.gov", sent: iso(NOW - (WSW.v - i) * 3600e3) })) : [];
  if (m >= 700 && m <= 800) A("wsw." + WSW.v, WSW.event, "Severe", "Shasta Lake and North Shasta County; Mount Shasta and Western Siskiyou County", {
    messageType: WSW.v > 1 ? "Update" : "Alert", references: refs,
    senderName: "NWS Medford OR",
    parameters: { NWSheadline: ["WINTER STORM WARNING IN EFFECT UNTIL 10 AM PST WEDNESDAY ABOVE 2500 FEET"] },
    description: "* WHAT...Heavy snow expected above 2500 feet. Total snow accumulations of 8 to 14 inches. Winds gusting as high as 45 mph.\n\n* WHERE...Interstate 5 from Lakehead to Weed, including Dunsmuir and Mount Shasta City.\n\n* WHEN...Until 10 AM PST Wednesday.\n\n* IMPACTS...Travel could be very difficult to impossible. The hazardous conditions could impact the morning commute.",
    instruction: "If you must travel, keep an extra flashlight, food, and water in your vehicle in case of an emergency.\nThe latest road conditions for California can be obtained by calling 1-800-427-7623." });
  if (m >= 640 && m <= 720) A("wind.1", "Wind Advisory", "Moderate", "South-Central Shasta County Including Redding Metro; Northern Sacramento Valley", { description: "* WHAT...South winds 20 to 30 mph with gusts up to 45 mph.\n\n* WHERE...Redding and the northern Sacramento Valley.\n\n* WHEN...Until 4 PM PST Wednesday." });
  // the last miles before the Oregon line (the alert points ahead of mile 700 end there, at the end of the road)
  if (m >= 790 && m <= 840) A("wwa.1", "Winter Weather Advisory", "Moderate", "Central Siskiyou County Including Shasta Valley", { onset: iso(NOW + 6 * 3600e3), senderName: "NWS Medford OR", description: "* WHAT...Snow expected. Total snow accumulations of 2 to 5 inches.\n\n* WHERE...Interstate 5 from Yreka to the Oregon line, including Hornbrook and Hilt." });
  A("beach.1", "Beach Hazards Statement", "Moderate", "San Diego County Coastal Areas");                 // not a road hazard: dropped
  A("test.1", "Winter Storm Warning", "Severe", "Test Zone", { status: "Test" });                        // test message: dropped
  A("old.1", "High Wind Warning", "Severe", "Old Zone", { ends: iso(NOW - 3600e3), expires: iso(NOW - 3600e3) }); // over: dropped
  return { type: "FeatureCollection", features: feats };
}

/* ---------- fake Caltrans (sample files, edited) ---------- */
const CC_DESC = {
  "R-1": "Chains are required on all vehicles except passenger vehicles and pickups under 6,000 pounds gross weight and equipped with snow tires on at least two drive wheels.",
  "R-2": "Chains are required on all vehicles except four wheel drive vehicles with snow tread tires on all four wheels.",
};
function editCC(d, api) {
  const set = (c, st) => { c.statusData.status = st; c.statusData.statusDescription = CC_DESC[st]; };
  for (const row of d.data) {
    const c = row.cc, L = c.location;
    if (L.route !== "I-5") continue;
    const lat = +L.latitude;
    if (SCEN === "south") continue;
    if (lat > 40.95 && lat < 41.1 && L.direction === "North") set(c, "R-1");      // Lakehead
    else if (lat >= 41.1 && lat < 41.5) set(c, "R-2");                          // Castella, Dunsmuir, Mount Shasta, Weed
    else if (SCEN === "chains" && lat >= 41.7 && lat < 42) set(c, "R-2");       // Yreka to Hilt: 34 mi past Mount Shasta
  }
  return d;
}
function editCMS(d, signs) {
  for (const row of d.data) {
    const c = row.cms, L = c.location;
    if (L.route !== "I-5") continue;
    if (/Lamoine/.test(L.locationName)) {
      c.message.display = "2 Pages (Extended)";
      Object.assign(c.message.phase1, { phase1Line1: "CHAIN CONTROLS", phase1Line2: "AHEAD", phase1Line3: "R-2 AT CASTELLA" });
      Object.assign(c.message.phase2, { phase2Line1: "CARRY CHAINS", phase2Line2: "OR TRACTION", phase2Line3: "DEVICES" });
      signs.push(L);
    }
    if (/Smith Road S\/B/.test(L.locationName)) {      // southbound one, must not show when going north
      c.message.display = "1 Page (Normal)";
      Object.assign(c.message.phase1, { phase1Line1: "SB TRAFFIC", phase1Line2: "SHOULD NOT", phase1Line3: "SHOW NORTHBOUND" });
    }
  }
  return d;
}

/* ---------- fake /api/traffic (tools/traffic-sample.json: 24 real incidents, rewritten to be current) ---------- */
let trafficFx = null;
async function trafficFixture() {
  if (!trafficFx) trafficFx = await (await fetch("traffic-sample.json")).json();
  return JSON.parse(JSON.stringify(trafficFx));
}
const TRAFFIC_SCEN = /^traffic/.test(SCEN);

/* ---------- network: mock (default) or real, always recorded ---------- */
function installNet(win, api) {
  const calls = [];
  const real = win.fetch.bind(win);
  const net = { calls, count: (rx = /./) => calls.filter(c => rx.test(c.url)).length, signs: [],
    fail: SCEN === "fail" || SCEN === "deadzone" || SCEN === "retry",       // every request fails (no signal)
    failForecast: SCEN === "partial" || SCEN === "nowx",                    // forecasts answer 500, the rest works
    failOthers: SCEN === "srcfail" };                                        // alerts and Caltrans answer 500, weather works
  const R = (body, status = 200, type = "application/geo+json") =>
    new win.Response(body instanceof ArrayBuffer || typeof body === "string" ? body : JSON.stringify(body), { status, headers: { "Content-Type": type } });
  const delay = (ms, signal) => new Promise((res, rej) => {
    const t = setTimeout(res, ms);
    signal && signal.addEventListener("abort", () => { clearTimeout(t); rej(new DOMException("aborted", "AbortError")); });
  });
  // net.traffic.mode: ok | fail | 500 | bad | hang;  age: ms the server's "updated" lags;  edit(body): change the answer
  net.traffic = { calls: [], mode: "ok", age: 0, edit: null };
  win.fetch = async (url, opts = {}) => {
    url = String(url && url.url || url);
    if (/\/api\/traffic(\?|$)/.test(url) && TRAFFIC_SCEN) {
      const T = net.traffic;
      T.calls.push({ url, t: Date.now(), method: opts.method || "GET", body: opts.body == null ? null : opts.body, headers: opts.headers || null });
      await delay(40, opts.signal);
      if (T.mode === "fail") throw new TypeError("Failed to fetch");
      if (T.mode === "500") return R({ error: "down" }, 500, "application/json");
      if (T.mode === "bad") return R("<html><h1>Bad gateway</h1></html>", 200, "text/html");
      if (T.mode === "hang") await delay(120e3, opts.signal);
      const body = await trafficFixture();
      body.updated = iso(Date.now() - T.age);
      if (T.edit) T.edit(body);
      return R(body, 200, "application/json");
    }
    if (!/^https:\/\/(api\.weather\.gov|cwwp2\.dot\.ca\.gov)\//.test(url)) return real(url, opts);
    calls.push({ url, t: Date.now() });
    if (SCEN === "real") return real(url, opts);
    await delay(30 + calls.length % 5 * 20, opts.signal);
    if (net.fail) throw new TypeError("Failed to fetch");
    const u = new URL(url);
    let mm;
    if ((mm = /^\/points\/(-?[\d.]+),(-?[\d.]+)$/.exec(u.pathname))) {
      const m = win.I5BUDDY.locate(+mm[1], +mm[2]).m;
      return R({ properties: { forecast: `https://api.weather.gov/gridpoints/MOCK/${Math.round(m)},1/forecast`,
        relativeLocation: { properties: { city: town(m), state: api.data.stateAt(m).id } } } });
    }
    if ((mm = /^\/gridpoints\/MOCK\/(\d+),1\/forecast$/.exec(u.pathname))) {
      if (net.failForecast) return R({ status: 500, title: "Unexpected Problem", detail: "An unexpected problem has occurred." }, 500, "application/problem+json");
      return R(forecastFor(api, +mm[1]));
    }
    if (u.pathname === "/alerts/active" && net.failOthers) return R({ status: 500, title: "Unexpected Problem" }, 500, "application/problem+json");
    if (u.pathname === "/alerts/active") {
      const [la, lo] = (u.searchParams.get("point") || "0,0").split(",").map(Number);
      return R(alertsFor(win.I5BUDDY.locate(la, lo).m));
    }
    if ((mm = /^\/data\/d(\d+)\/(cc|cms)\/(?:cc|cms)Status(D\d\d)\.json$/.exec(u.pathname))) {
      const nn = mm[3].slice(1), file = `${mm[2]}-${nn}.json`;
      const s = await sample(file);
      if (s.status !== 200 || net.failOthers) return R("<html><h1>500 Internal Server Error</h1></html>", 500, "text/html");
      if (nn === "02" && mm[2] === "cc") return R(editCC(json(s.buf), api), 200, "application/json");
      if (nn === "02" && mm[2] === "cms") return R(editCMS(json(s.buf), net.signs), 200, "application/json");
      return R(s.buf.slice(0), 200, "application/json"); // as served (cc-11 has Latin-1 bytes, cc-12 is a 500 page)
    }
    return R({ title: "not found" }, 404);
  };
  return net;
}

/* ---------- a last-good copy from 12 minutes ago (for ?s=fail) ---------- */
function staleSnap() {
  const t = NOW - 12 * MIN;
  const per = (n, name, day, temp, short) => ({ name, start: iso(t + (n - 1) * 12 * 3600e3), end: iso(NOW + n * 12 * 3600e3), day, temp, unit: "F", short, wind: "10 mph", windDir: "S", pop: 70, detail: short + "." });
  return { v: 1, okT: t,
    wx: [
      { m: 725, lat: 41.15, lon: -122.31, city: "Castella", st: "CA", url: "https://api.weather.gov/gridpoints/MOCK/725,1/forecast", t, periods: [per(1, "This Afternoon", true, 41, "Rain And Snow Showers Likely"), per(2, "Tonight", false, 29, "Snow Showers")] },
      { m: 790, lat: 41.9, lon: -122.57, city: "Hornbrook", st: "CA", url: "https://api.weather.gov/gridpoints/MOCK/790,1/forecast", t, periods: [per(1, "This Afternoon", true, 44, "Chance Rain Showers"), per(2, "Tonight", false, 31, "Snow Showers Likely")] },
    ],
    alerts: [],
    cc: { "02": { t, items: [
      { id: "mock-1", m: 711.1, dir: "N", level: 1, status: "R-1", desc: CC_DESC["R-1"], place: "Lakehead", name: "19 miles south of Dunsmuir" },
      { id: "mock-2", m: 723.8, dir: "N", level: 2, status: "R-2", desc: CC_DESC["R-2"], place: "Castella", name: "6 miles south of Dunsmuir" },
    ] } },
    cms: {},
  };
}

    localCams(api, m0 - 70, m0 + 70);

    await turnOn(api);

    log("requests", net.calls.map(c => c.url.replace(/^https:\/\//, "")));

    check("each camera names its source from the data", labels.every((t, i) => want[i] && t.endsWith("· " + want[i].by)), labels.join(" | "));

    const exp = [25, 90].map(a => Math.min(D.MAX_M, m0 + a)).filter((t, i, a) => a.findIndex(x => Math.abs(x - t) < 12) === i);
    check(`weather ahead: ${exp.length} point${exp.length === 1 ? "" : "s"}, the first at the end of the road or before`, doc.querySelectorAll(".lv-wxpt").length === exp.length, txt($(doc, ".lv-wx")));

  async speech(api, win, doc, net) {

    const spoken = recordSpeech(api);

    await turnOn(api);
    await settle(api);

    // 1. Demo drive
    mark("demo1"); api.startDemo();
    await until(both(0), 90000, 250).catch(() => {});
    log("demo start:", ids());
    check("demo: greeting first", ids()[0] === "greet");
    check("demo: chain controls spoken once, after the greeting", ids().filter(isCC).length === 1 && ids().findIndex(isCC) > 0, order(0));
    check("demo: winter storm warning spoken once, after the greeting", ids().filter(isWSW).length === 1 && ids().findIndex(isWSW) > 0, order(0));
    check("demo: chain controls (prio 3) before the warning (prio 2)", ids().findIndex(isCC) < ids().findIndex(isWSW));
    // 2. End the trip, then Start GPS (a fake GPS a few miles on)
    mark("end1"); api.stopAll(false);
    // voice.js: when an item is stopped during its chime, its pump() later sets current = null even if a newer item
    // is speaking by then, and the next queued item starts over it. Let such a chime run out between the parts.
    await wait(1500);
    let k = spoken.length;
    fakeGps(win, 704);
    mark("gps2"); api.startGps();
    await until(both(k), 90000, 250).catch(() => {});
    log("gps start:", ids(k));
    check("gps: greeting first", ids(k)[0] === "greet");
    check("gps: new trip, chain controls and the warning again, once each", ids(k).filter(isCC).length === 1 && ids(k).filter(isWSW).length === 1, order(k));
    // 3. A new trip, and Stop is pressed during the greeting: both were waiting, neither is lost
    api.stopAll(false);
    await wait(1500);   // let a chime cut by stopAll run out (the voice.js race above)
    k = spoken.length;
    mark("demo3"); api.startDemo();
    await wait(1200);
    check("stop: both still waiting during the greeting", voiceWaiting(api).some(isCC) && voiceWaiting(api).some(isWSW), voiceWaiting(api).join());
    mark("stop3"); api.voice.stop();

    await until(both(k), 90000, 250).catch(() => {});
    const back = spoken.slice(k).find(s => isCC(s.id));

    check("stop: chain controls and the warning come back later, once each", ids(k).filter(isCC).length === 1 && ids(k).filter(isWSW).length === 1, order(k));
    check("stop: not straight away (about 30 s later)", back && back.t - tStop >= 25e3 && back.t - tStop < 45e3, back ? `${Math.round((back.t - tStop) / 1000)} s` : "never");
    // 4. A new trip, and "Next landmark" (now:true) cuts in during the greeting: they follow it

    await wait(1500);   // let a chime cut by stopAll run out (the voice.js race above)
    k = spoken.length;
    mark("demo4"); api.startDemo();
    await wait(1200);
    mark("next4"); api.narrator.nextOne();
    const tNext = Date.now();
    await until(both(k), 90000, 250).catch(() => {});
    const nextId = ids(k).find(id => id !== "greet" && !isCC(id) && !isWSW(id));

    check("next: the landmark plays, then chain controls and the warning, once each",

    api.stopAll(false);
    if (Q.get("dbg")) {
      log("marks:", marks.map(([n, t]) => `${n}@${t - T0}`).join(" "));
      for (const e of win.__speech || []) log(`synth ${e.t - T0} ${e.ev} ${e.text.slice(0, 50)}`);

/** Headless (virtual time) can keep an old layout/frame of the iframe; a 1px resize makes it current. */
async function nudge() {
  const w0 = f.style.width;
  f.style.width = (parseInt(w0) - 1) + "px"; await wait(60);
  f.style.width = w0; await wait(60);
}

/* ---------- views for screenshots ---------- */
async function applyView(api, win, doc) {
  const scrollTo = async sel => {
    for (let i = 0; i < 6; i++) { // content above may still grow (photos, fonts): repeat until it sits still
      const n = $(doc, sel);
      if (!n) return;
      const y = Math.round(n.getBoundingClientRect().top + win.scrollY - 64);
      if (Math.abs(win.scrollY - Math.min(y, doc.documentElement.scrollHeight - win.innerHeight)) < 2 && i) return;
      win.scrollTo(0, y);

  };
  if (VIEW === "top") win.scrollTo(0, 0);
  else if (VIEW === "more") { const b = $(doc, ".lv-more"); b && b.click(); await wait(100); win.scrollTo(0, 0); }
  else if (VIEW === "block") await scrollTo("#liveBlock");

}

/** The app reloads itself once when its service worker first takes control (main.js, controllerchange).
    Give the worker a short head start; if the app still reloads mid-run, the run is repeated (see below). */
async function swReady(tries) {
  if (!("serviceWorker" in navigator)) return;
  try {
    await navigator.serviceWorker.register("../sw.js");
    // No timers here on purpose: headless virtual time jumps straight to the next timer, while the worker
    // installs in real time. Awaiting the worker itself lets real time pass without spending the budget.
    let done = false;
    const claimed = new Promise(r => {
      if (navigator.serviceWorker.controller) return r();
      navigator.serviceWorker.addEventListener("controllerchange", r, { once: true });
    });
    const poll = (async () => { // safety net if the worker never claims: small real fetches, then give up
      for (let i = 0; i < tries && !done; i++) await fetch("../manifest.webmanifest?sw=" + i, { cache: "no-store" }).catch(() => {});
    })();
    await Promise.race([navigator.serviceWorker.ready.then(() => claimed), poll]);
    done = true;
  } catch (e) { log("service worker not ready: " + e.message); }
}
function resetStorage() {
  for (const k of Object.keys(localStorage)) if (k.startsWith("i5b:")) localStorage.removeItem(k);
  localStorage.setItem("i5b:settings", JSON.stringify({ live: live0, theme: THEME, narr: true }));
  const snap = { fail: staleSnap, partial: oldWxSnap, deadzone: deadSnap }[SCEN];
  if (snap) localStorage.setItem("i5b:live:snap", JSON.stringify(snap()));
}
let loads = 0;
f.addEventListener("load", () => { loads++; });

/** One run of the scenario on the page now in the frame. Returns "reloaded" if the app reloaded under it. */
async function attempt() {
  const baseLoads = loads;
  const win = f.contentWindow, doc = f.contentDocument, api = win.I5BUDDY.api;
  try {
    api.settings.theme = THEME;
    doc.documentElement.dataset.theme = THEME;
    const errs = [];
    const ce = win.console.error.bind(win.console);
    win.console.error = (...a) => { errs.push(a.map(String).join(" ")); ce(...a); };
    const cw = win.console.warn.bind(win.console);
    win.console.warn = (...a) => { if (/\[live\]/.test(String(a[0]))) errs.push(a.map(String).join(" ")); cw(...a); };
    win.addEventListener("error", e => errs.push("uncaught: " + e.message));
    win.addEventListener("unhandledrejection", e => errs.push("unhandled: " + ((e.reason && e.reason.message) || e.reason)));
    const net = installNet(win, api);
    await SCENARIOS[SCEN](api, win, doc, net);
    if (loads !== baseLoads) return "reloaded";
    if (SCEN !== "unit") {
      await nudge();
      await applyView(api, win, doc);
      await nudge();
      const de = doc.documentElement;
      check("no horizontal page scroll", de.scrollWidth <= de.clientWidth, `${de.scrollWidth} vs ${de.clientWidth}`);
      const small = [...doc.querySelectorAll("#liveAlerts button, #liveBlock button, #liveBlock a, .lv-sheet button, .lv-sheet a")]
        .filter(b => b.offsetParent && !b.closest(".lv-cams")).map(b => [b, b.getBoundingClientRect()]).filter(([, r]) => r.height < 43.5 || r.width < 43.5);
      check("touch targets >= 44 px", !small.length, small.map(([b, r]) => `${txt(b).slice(0, 20)} ${Math.round(r.width)}x${Math.round(r.height)}`).join(", "));
    }
    if (loads !== baseLoads) return "reloaded";
    check("no errors or [live] warnings in the app", !errs.length, errs.join(" | "));
    return "done";
  } catch (e) {
    if (loads !== baseLoads) return "reloaded";
    throw e;
  }
}

/** Load the app into the frame. Default: index.html as srcdoc with <base> at the app root and service-worker
    registration stubbed, so the app never reloads itself under the test (the worker would claim the page and
    main.js reloads on controllerchange). Same code, same origin, same localStorage. ?sw=1 loads index.html as is. */
let appHtml = null;
async function loadApp(first) {
  if (REAL) { if (first) f.src = "../index.html"; else f.contentWindow.location.reload(); return; }
  if (!appHtml) {
    const html = await (await fetch("../index.html", { cache: "no-store" })).text();
    const stub = `<base href="${new URL("../", location.href).href}"><script>try{Object.defineProperty(navigator.serviceWorker,"register",` +
      `{configurable:true,value:function(){return new Promise(function(){})}})}catch(e){}` +
      (Q.get("speech") === "real" ? "" : `(${fakeSpeech.toString()})();`) + `<\/script>`;
    appHtml = html.replace(/<head>/i, "<head>" + stub);
  }
  if (first) f.srcdoc = appHtml; else f.contentWindow.location.reload();
}
const REAL = !!Q.get("sw");

(async () => {
  try {
    if (REAL) {
      const t0 = performance.now();
      await swReady(Q.get("swwait") ? +Q.get("swwait") : 200);
      log(`service worker head start ${Math.round(performance.now() - t0)} ms (controlled: ${!!navigator.serviceWorker.controller})`);
    }
    for (let run = 1; run <= 3; run++) {
      resetStorage();
      const before = loads;
      await loadApp(run === 1);
      const ready = () => loads > before && f.contentDocument.readyState === "complete" && f.contentWindow.I5BUDDY && f.contentWindow.I5BUDDY.api.live;
      try { await until(ready, 20000); } catch {
        const w = f.contentWindow;
        log(`the app did not start in 20 s (loads ${loads - before}, ${f.contentDocument && f.contentDocument.readyState}, I5BUDDY ${!!(w && w.I5BUDDY)}, live ${!!(w && w.I5BUDDY && w.I5BUDDY.api.live)}); loading it again`);
        if (run < 3) { appHtml = null; continue; }
        throw new Error("the app did not start");
      }
      await wait(150);
      if (loads > before + 1) { log("the app reloaded itself while starting; starting again"); continue; }
      if ((await attempt()) !== "reloaded") break;
      log("the app reloaded itself during the run (its service worker took control); running the scenario again");
      checks.length = 0;
    }

    check("test ran", false, String((e && e.stack) || e).replace(/\n\s*/g, " | "));

    } catch (e) { log("after: " + e.message); }
  }
})();
